<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual de Usuario · Turismo Eduardo Charme</title>
    <link rel="stylesheet" href="css/manual.css">
</head>
<body>

<header>
    <h1>📖 Manual de Usuario</h1>
    <div style="display: flex; align-items: center; gap: 12px;">
        <span class="user-badge" id="userBadge">Cargando...</span>
        <a href="index.html" class="volver">← Volver al Lobby</a>
    </div>
</header>

<!-- BARRA DE BÚSQUEDA -->
<div class="manual-buscador">
    <span class="lupa">🔍</span>
    <input type="text" id="inputBuscar" placeholder="Busca: 'planificar', 'galería', 'contraseña', 'PDF'...">
    <button id="btnLimpiar" title="Limpiar búsqueda">✕</button>
</div>

<div id="resultadoBusqueda" class="resultado-busqueda oculto"></div>

<!-- LAYOUT PRINCIPAL -->
<div class="manual-wrap">
    <aside class="manual-sidebar">
        <h2>📑 Secciones</h2>
        <nav id="indiceSecciones"></nav>
    </aside>

    <main class="manual-contenido" id="manualContenido">
        <!-- Contenido generado por JS -->
    </main>
</div>

<footer>
    Manual generado para la Especialidad de Turismo · Liceo Eduardo Charme
</footer>

<script src="js/github.js"></script>
<script src="js/auth.js"></script>
<script>
(function() {
    // ============================================================
    // 1. VERIFICAR SESIÓN Y ROL
    // ============================================================
    const usuario = Auth.getSesion();
    if (!usuario) {
        window.location.href = 'login.html';
        return;
    }
    document.getElementById('userBadge').textContent =
        `${usuario.nombre} ${usuario.apellido || ''} (${usuario.rol})`;

    // Normalizar rol para el manual
    let rol = 'estudiante';
    if (usuario.rol === 'admin') rol = 'admin';
    else if (usuario.rol === 'guia' || usuario.rol === 'asistente') rol = 'guia';

    // 2. CONTENIDO DEL MANUAL
    //    roles: ['all'] → todos | ['guia'] | ['admin'] | ['estudiante']
    // ============================================================
    const SECCIONES = [
    // ---------- INTRODUCCIÓN ----------
    {
        id: 'intro',
        titulo: '👋 Introducción',
        roles: ['all'],
        articulos: [
            {
                titulo: '¿Qué es esta plataforma?',
                html: `
                    <p>La plataforma <strong>Turismo Eduardo Charme</strong> es el sistema oficial de gestión de salidas pedagógicas de la Especialidad de Turismo. Aquí podrás:</p>
                    <ul>
                        <li>📋 Ver todas las salidas programadas (pasadas y futuras).</li>
                        <li>📝 Inscribirte o revisar tu participación.</li>
                        <li>📸 Compartir fotos de los viajes en la galería.</li>
                        <li>📅 Consultar el calendario interactivo personal.</li>
                        <li>✏️ Modificar los datos de tu cuenta cuando lo necesites.</li>
                    </ul>
                    <div class="nota tip">
                        <strong>💡 Tip:</strong> Esta guía se adapta a tu rol. Como <strong>${rol === 'admin' ? 'administrador' : rol === 'guia' ? 'guía/asistente' : 'estudiante'}</strong> verás sólo las herramientas que puedes usar.
                    </div>
                `
            },
            {
                titulo: '¿Cómo navego por el manual?',
                html: `
                    <p>Este manual tiene 3 herramientas pensadas para ti:</p>

                        <li><strong>Barra de búsqueda</strong> (arriba): escribe una palabra y filtra los artículos al instante.</li>

                    {
                        q: '¿Qué significa la calificación con piñas?',
                        a: 'Es la valoración que el autor le da a la experiencia del viaje, en una escala de 1 a 5 piñas 🍍. Es sólo informativa y decorativa.'
                    },
                    {
                        q: '¿Puedo editar una salida ya guardada?',
                        a: 'Sí, si eres admin o guía/asistente. Entra a <strong>Mis Salidas</strong>, abre la salida y pulsa <strong>✏️ Editar</strong>. Podrás modificar cualquier campo, incluida la ruta y los participantes.'
                    },
                    {
                        q: '¿Cómo exporto una salida a PDF?',
                        a: 'En <strong>Mis Salidas</strong>, con la salida abierta, presiona <strong>🖨️ Exportar PDF</strong>. Se genera un PDF con la ficha completa que se descarga automáticamente.'
                    },
                    {
                        q: '¿Cómo cambio mi rol de estudiante a guía?',
                        a: 'No puedes cambiarlo tú mismo. Un administrador debe asignarte el rol desde el Panel de Administración. Si tu RUT está en la lista de autorizados al registrarte, se te asigna automáticamente.'
                    },
                    {
                        q: '¿Los datos se guardan solos?',
                        a: 'Sí. Cada guardado (nueva salida, edición de usuario, publicación, etc.) se sube automáticamente a GitHub mediante un Worker. Verás mensajes de confirmación al terminar.'
                    },
                    {
                        q: 'No me carga la página / aparece "Cargando...".',
                        a: 'Suele ser un problema de conexión con el Worker de GitHub. Recarga la página con F5. Si persiste, avisa al administrador del sistema.'
                    },
                    {
                        q: '¿Puedo usar la plataforma en el celular?',
                        a: 'Sí. Todo el sistema es responsive. En móviles, las tablas se vuelven desplazables horizontalmente y los botones se agrandan para uso táctil.'
                    },
                    {
                        q: '¿Qué hago si borré una salida por error?',
                        a: 'No hay papelera. Contacta a un administrador; aunque lo más probable es que haya que volver a crearla. Ten cuidado al pulsar 🗑️ Eliminar.'
                    }
                ]
            }
        ]
    }
    ];

    // ============================================================
    // 3. RENDERIZAR EL MANUAL SEGÚN EL ROL
    // ============================================================
    const contenidoEl = document.getElementById('manualContenido');
    const indiceEl = document.getElementById('indiceSecciones');

    // Filtrar secciones visibles para el rol
    const seccionesVisibles = SECCIONES.filter(s =>
        s.roles.includes('all') || s.roles.includes(rol)
    );

    // HTML
    let htmlContenido = '';
    let htmlIndice = '';

    seccionesVisibles.forEach(sec => {
        // Header de la sección
        htmlContenido += `<section class="manual-seccion" id="sec-${sec.id}" data-id="${sec.id}">`;
        htmlContenido += `<h2>${sec.titulo}</h2>`;

        // Artículos
        sec.articulos.forEach(art => {
            htmlContenido += `<article class="manual-articulo">`;
            htmlContenido += `<h3>${art.titulo}</h3>`;

            if (art.esFAQ && art.faqs) {
                // Render especial para FAQ (colapsable)
                art.faqs.forEach(f => {
                    htmlContenido += `
                        <div class="faq-item">
                            <div class="faq-pregunta">${f.q}</div>
                            <div class="faq-respuesta">${f.a}</div>
                        </div>
                    `;
                });
            } else {
                htmlContenido += art.html;
            }

            htmlContenido += `</article>`;
        });

        htmlContenido += `</section>`;

        // Índice
        htmlIndice += `<a href="#sec-${sec.id}" data-target="sec-${sec.id}">${sec.titulo}</a>`;
    });

    contenidoEl.innerHTML = htmlContenido;
    indiceEl.innerHTML = htmlIndice;

    // ============================================================
    // 4. FAQ COLAPSABLE
    // ============================================================
    contenidoEl.querySelectorAll('.faq-item').forEach(item => {
        const pregunta = item.querySelector('.faq-pregunta');
        pregunta.addEventListener('click', () => {
            item.classList.toggle('abierto');
        });
    });

    // ============================================================
    // 5. NAVEGACIÓN DEL ÍNDICE (scroll suave)
    // ============================================================
    indiceEl.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault();
            const target = document.getElementById(a.dataset.target);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    });

    // ============================================================
    // 6. SCROLL SPY (resaltar sección activa)
    // ============================================================
    const seccionesEls = contenidoEl.querySelectorAll('.manual-seccion');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const id = entry.target.dataset.id;
                indiceEl.querySelectorAll('a').forEach(a => {
                    a.classList.toggle('activo', a.dataset.target === `sec-${id}`);
                });
            }
        });
    }, { rootMargin: '-30% 0px -60% 0px', threshold: 0 });

    seccionesEls.forEach(s => observer.observe(s));

    // ============================================================
    // 7. BUSCADOR EN VIVO
    // ============================================================
    const inputBuscar = document.getElementById('inputBuscar');
    const btnLimpiar = document.getElementById('btnLimpiar');
    const resultadoDiv = document.getElementById('resultadoBusqueda');

    function normalizar(str) {
        return (str || '').toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // quita tildes
    }

    function buscar(query) {
        const q = normalizar(query).trim();

        if (!q) {
            // Reset: mostrar todo
            seccionesEls.forEach(sec => {
                sec.style.display = '';
                sec.querySelectorAll('.manual-articulo').forEach(a => a.style.display = '');
                sec.querySelectorAll('.faq-item').forEach(f => f.style.display = '');
            });
            indiceEl.querySelectorAll('a').forEach(a => a.style.display = '');
            resultadoDiv.classList.add('oculto');
            return;
        }

        let totalMatches = 0;

        seccionesEls.forEach(sec => {
            let matchesSec = 0;
            const articulos = sec.querySelectorAll('.manual-articulo');

            articulos.forEach(art => {
                let matchesArt = 0;

                // ¿Es un artículo con FAQs individuales?
                const faqs = art.querySelectorAll('.faq-item');
                if (faqs.length > 0) {
                    faqs.forEach(f => {
                        const txt = normalizar(f.textContent);
                        if (txt.includes(q)) {
                            f.style.display = '';
                            matchesArt++;
                        } else {
                            f.style.display = 'none';
                        }
                    });
                } else {
                    const txt = normalizar(art.textContent);
                    if (txt.includes(q)) {
                        matchesArt = 1;
                    }
                }

                if (matchesArt > 0) {
                    art.style.display = '';
                    matchesSec += matchesArt;
                } else {
                    art.style.display = 'none';
                }
            });

            if (matchesSec > 0) {
                sec.style.display = '';
            } else {
                sec.style.display = 'none';
            }

            // Actualizar enlace del índice
            const link = indiceEl.querySelector(`a[data-target="sec-${sec.dataset.id}"]`);
            if (link) link.style.display = matchesSec > 0 ? '' : 'none';

            totalMatches += matchesSec;
        });

        // Mensaje de resultado
        if (totalMatches === 0) {
            resultadoDiv.textContent = `❌ No se encontraron resultados para "${query}". Prueba con otra palabra.`;
        } else {
            resultadoDiv.textContent = `✅ ${totalMatches} resultado${totalMatches !== 1 ? 's' : ''} para "${query}"`;
        }
        resultadoDiv.classList.remove('oculto');
    }

    inputBuscar.addEventListener('input', function() {
        buscar(this.value);
    });

    btnLimpiar.addEventListener('click', function() {
        inputBuscar.value = '';
        buscar('');
        inputBuscar.focus();
    });

    // Buscar con Enter
    inputBuscar.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            buscar(this.value);
        }
        if (e.key === 'Escape') {
            btnLimpiar.click();
        }
    });

    console.log('✅ Manual de Usuario cargado para rol:', rol);
})();
</script>
</body>
</html>
