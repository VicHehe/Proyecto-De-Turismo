<script src="js/auth.js"></script>

                esFAQ: true,
                faqs: [
                    {
                        q: '¿Qué hago si olvidé mi contraseña?',
                        a: 'Por seguridad no existe una opción de "recuperar contraseña" automática. Contacta a un administrador para que la restablezca desde el Panel de Administración.'
                    },
                    {
                        q: '¿Por qué no veo una salida en mi calendario?',
                        a: 'El calendario muestra las salidas según tu rol: como estudiante ves sólo donde estás inscrito; como guía/asistente ves donde participas o guías; como administrador ves todas. Si crees que falta alguna, pídele a un guía que te agregue.'
                    },
                    {
                        q: 'No puedo subir fotos a la galería.',
                        a: 'Sólo los roles <strong>administrador, guía y asistente</strong> pueden crear publicaciones. Si eres estudiante, pídele a un guía que suba las fotos del viaje.'
                    },
                    {
                        q: '¿Cuántas fotos puedo subir por publicación?',
                        a: 'Hasta <strong>4 fotos</strong> por publicación, en formato JPG o PNG. El sistema las achica automáticamente para que la galería cargue rápido.'
                    },
                    {
                        q: '¿Qué significan las piñas de pino en la galería?',
                        a: 'Es la calificación que el autor le da a la experiencia del viaje, en una escala de 1 a 5 piñas de pino. Es sólo informativa y decorativa, como las estrellas de una reseña.'
                    },
                    {
                        q: '¿Puedo editar una salida que ya guardé?',
                        a: 'Sí, si eres administrador o guía/asistente. Entra a <strong>Mis Salidas</strong>, abre la salida y pulsa <strong>✏️ Editar</strong>. Podrás modificar cualquier campo, incluida la ruta y los participantes.'
                    },
                    {
                        q: '¿Cómo descargo una salida en PDF?',
                        a: 'En <strong>Mis Salidas</strong>, con la salida abierta, presiona <strong>🖨️ Exportar PDF</strong>. Se genera un archivo PDF con la ficha completa que se descarga automáticamente a tu computador o celular.'
                    },
                    {
                        q: '¿Cómo puedo pasar de estudiante a guía?',
                        a: 'No puedes cambiarlo tú mismo. Un administrador debe asignarte el rol desde el Panel de Administración. Si al registrarte tu RUT ya estaba autorizado por la especialidad, se te asigna automáticamente.'
                    },
                    {
                        q: '¿Los datos se guardan automáticamente?',
                        a: 'Sí. Cada vez que guardas una salida, editas un usuario o subes una publicación, el sistema lo guarda automáticamente. Verás un mensaje de confirmación al terminar.'
                    },
                    {
                        q: 'La página se queda cargando y no pasa nada.',
                        a: 'Suele ser un problema temporal de conexión. Intenta recargar la página. Si sigue igual, avisa al administrador del sistema.'
                    },
                    {
                        q: '¿Puedo usar la plataforma desde el celular?',
                        a: 'Sí. Todo el sistema funciona bien en celulares y tablets. Las tablas se pueden desplazar de lado a lado y los botones son grandes para usar con el dedo.'
                    },
                    {
                        q: '¿Qué hago si borré una salida por error?',
                        a: 'No existe una papelera de reciclaje: lo eliminado no se puede recuperar. Ten cuidado al pulsar 🗑️ Eliminar. Si fue un error, tendrás que volver a crear la salida desde cero.'
                    }
                ]
            }
        ]
    }
    ];

    // ============================================================
    // 3. RENDERIZAR EL MANUAL SEGÚN EL ROL
    // ============================================================
    const contenidoEl = document.getElementById('manualContenido');
    const indiceEl = document.getElementById('indiceSecciones');

    // Filtrar secciones visibles para el rol
    const seccionesVisibles = SECCIONES.filter(s =>
        s.roles.includes('all') || s.roles.includes(rol)
    );

    // HTML
    let htmlContenido = '';
    let htmlIndice = '';

    seccionesVisibles.forEach(sec => {
        htmlContenido += `<section class="manual-seccion" id="sec-${sec.id}" data-id="${sec.id}">`;
        htmlContenido += `<h2>${sec.titulo}</h2>`;

        sec.articulos.forEach(art => {
            htmlContenido += `<article class="manual-articulo">`;
            htmlContenido += `<h3>${art.titulo}</h3>`;

            if (art.esFAQ && art.faqs) {
                art.faqs.forEach(f => {
                    htmlContenido += `
                        <div class="faq-item">
                            <div class="faq-pregunta">${f.q}</div>
                            <div class="faq-respuesta">${f.a}</div>
                        </div>
                    `;
                });
            } else {
                htmlContenido += art.html;
            }

            htmlContenido += `</article>`;
        });

        htmlContenido += `</section>`;

        htmlIndice += `<a href="#sec-${sec.id}" data-target="sec-${sec.id}">${sec.titulo}</a>`;
    });

    contenidoEl.innerHTML = htmlContenido;
    indiceEl.innerHTML = htmlIndice;

    // ============================================================
    // 4. FAQ COLAPSABLE
    // ============================================================
    contenidoEl.querySelectorAll('.faq-item').forEach(item => {
        const pregunta = item.querySelector('.faq-pregunta');
        pregunta.addEventListener('click', () => {
            item.classList.toggle('abierto');
        });
    });

    // ============================================================
    // 5. NAVEGACIÓN DEL ÍNDICE
    // ============================================================
    indiceEl.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault();
            const target = document.getElementById(a.dataset.target);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    });

    // ============================================================
    // 6. RESALTAR SECCIÓN ACTIVA
    // ============================================================
    const seccionesEls = contenidoEl.querySelectorAll('.manual-seccion');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const id = entry.target.dataset.id;
                indiceEl.querySelectorAll('a').forEach(a => {
                    a.classList.toggle('activo', a.dataset.target === `sec-${id}`);
                });
            }
        });
    }, { rootMargin: '-30% 0px -60% 0px', threshold: 0 });

    seccionesEls.forEach(s => observer.observe(s));

    // ============================================================
    // 7. BUSCADOR EN VIVO
    // ============================================================
    const inputBuscar = document.getElementById('inputBuscar');
    const btnLimpiar = document.getElementById('btnLimpiar');
    const resultadoDiv = document.getElementById('resultadoBusqueda');

    function normalizar(str) {
        return (str || '').toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function buscar(query) {
        const q = normalizar(query).trim();

        if (!q) {
            seccionesEls.forEach(sec => {
                sec.style.display = '';
                sec.querySelectorAll('.manual-articulo').forEach(a => a.style.display = '');
                sec.querySelectorAll('.faq-item').forEach(f => f.style.display = '');
            });
            indiceEl.querySelectorAll('a').forEach(a => a.style.display = '');
            resultadoDiv.classList.add('oculto');
            return;
        }

        let totalMatches = 0;

        seccionesEls.forEach(sec => {
            let matchesSec = 0;
            const articulos = sec.querySelectorAll('.manual-articulo');

            articulos.forEach(art => {
                let matchesArt = 0;

                const faqs = art.querySelectorAll('.faq-item');
                if (faqs.length > 0) {
                    faqs.forEach(f => {
                        const txt = normalizar(f.textContent);
                        if (txt.includes(q)) {
                            f.style.display = '';
                            matchesArt++;
                        } else {
                            f.style.display = 'none';
                        }
                    });
                } else {
                    const txt = normalizar(art.textContent);
                    if (txt.includes(q)) {
                        matchesArt = 1;
                    }
                }

                if (matchesArt > 0) {
                    art.style.display = '';
                    matchesSec += matchesArt;
                } else {
                    art.style.display = 'none';
                }
            });

            sec.style.display = matchesSec > 0 ? '' : 'none';

            const link = indiceEl.querySelector(`a[data-target="sec-${sec.dataset.id}"]`);
            if (link) link.style.display = matchesSec > 0 ? '' : 'none';

            totalMatches += matchesSec;
        });

        if (totalMatches === 0) {
            resultadoDiv.textContent = `❌ No se encontraron resultados para "${query}". Prueba con otra palabra.`;
        } else {
            resultadoDiv.textContent = `✅ ${totalMatches} resultado${totalMatches !== 1 ? 's' : ''} para "${query}"`;
        }
        resultadoDiv.classList.remove('oculto');
    }

    inputBuscar.addEventListener('input', function() {
        buscar(this.value);
    });

    btnLimpiar.addEventListener('click', function() {
        inputBuscar.value = '';
        buscar('');
        inputBuscar.focus();
    });

    inputBuscar.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            buscar(this.value);
        }
        if (e.key === 'Escape') {
            btnLimpiar.click();
        }
    });

    console.log('✅ Manual de Usuario cargado para rol:', rol);
})();
</script>
</body>
</html>
