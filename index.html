<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turismo Eduardo Charme · Lobby</title>
<link rel="stylesheet" href="css/index.css">
</head>
<body>

<header>
    <div class="header-left">
        <div class="especialidad">
            <span>ESPECIALIDAD</span>
            <span>DE</span>
            <span>TURISMO</span>
            <span>LICEO EDUARDO CHARME</span>
        </div>
    </div>
    <div class="header-center">
        <h1>Turismo Eduardo Charme</h1>
        <p>Descubre la capital de la Provincia de Colchagua</p>
    </div>
    <div class="user-badge" id="userBadge">
        <span id="userNombre">Cargando...</span>
        <span class="rol" id="userRol">-</span>
    </div>
</header>

<nav id="navBotones">
    <!-- Los botones se generan con JavaScript según el rol -->
</nav>

<section class="hero">
    <h2>Bienvenido a Turismo Eduardo Charme</h2>
    <p>
        Aquí puedes inscribirte en guías turísticas y gestionar tus viajes.
    </p>
    <button onclick="sonido()">Comenzar recorrido</button>
</section>

<section class="lugares" id="contenedorSalidas">
    <!-- Se llena dinámicamente con las salidas guardadas -->
</section>

<footer>
    © 2026 Turismo Eduardo Charme
    <button class="btn-cerrar" id="btnCerrarSesion">Cerrar sesión</button>
</footer>

<!-- MODAL DE DETALLES -->
<div id="modalDetalles" class="modal">
    <div class="modal-content">
        <span class="modal-close" id="modalCerrar">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>

<script src="js/github.js"></script>
<script src="js/auth.js"></script>
<script src="js/planificacion.js"></script>
<script>
    // ============================================================
    // SONIDO (efecto "Comenzar recorrido")
    // ============================================================
    function sonido(){
        const audio = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = "triangle";
        osc.frequency.value = 700;
        osc.connect(gain);
        gain.connect(audio.destination);
        gain.gain.setValueAtTime(0.15, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.15);
        osc.start();
        osc.stop(audio.currentTime + 0.15);
    }

    // ============================================================
    // FUNCIÓN PARA OBTENER SALIDAS SEGÚN PERMISOS
    // ============================================================
    function getSalidasVisibles(todas, usuario) {
        const hoy = new Date().toISOString().split('T')[0];
        todas.forEach(s => {
            if (!s.guias) s.guias = [];
            if (!s.participantes) s.participantes = [];
        });

        if (usuario.rol === 'admin') {
            return todas;
        } else if (usuario.rol === 'guia' || usuario.rol === 'asistente') {
            return todas.filter(s => {
                const esGuia = s.guias.some(g => g.rut === usuario.rut);
                const esParticipante = s.participantes.some(p => p.rut === usuario.rut);
                return (esGuia || esParticipante) && s.fecha >= hoy;
            });
        } else {
            return todas.filter(s => {
                const esParticipante = s.participantes.some(p => p.rut === usuario.rut);
                return esParticipante && s.fecha >= hoy;
            });
        }
    }

    // ============================================================
    // MOSTRAR DETALLES (MODAL) + BOTÓN INSCRIPCIÓN
    // ============================================================
    function verDetalles(salida) {
        const usuario = Auth.getSesion();
        if (!usuario) return;
        const esAdminOGuia = usuario.rol === 'admin' || usuario.rol === 'guia' || usuario.rol === 'asistente';
        const esEstudiante = usuario.rol === 'visitante' || usuario.rol === 'estudiante';
        const modal = document.getElementById('modalDetalles');
        const body = document.getElementById('modalBody');

        let html = `<h2>${salida.titulo || 'Salida sin título'}</h2>`;
        html += `<div class="detalle-item"><strong>Fecha:</strong> ${salida.fecha || 'No definida'}</div>`;
        html += `<div class="detalle-item"><strong>Duración:</strong> ${salida.duracion || 'No especificada'}</div>`;
        html += `<div class="detalle-item"><strong>Descripción:</strong> ${salida.descripcion || 'Sin descripción'}</div>`;

        if (salida.ruta && salida.ruta.length > 0) {
            html += `<div class="detalle-item"><strong>Ruta:</strong><ul class="ruta-lista">`;
            salida.ruta.forEach(act => {
                html += `<li>${act.tipo}: ${act.descripcion} (${act.inicio} - ${act.fin})</li>`;
            });
            html += `</ul></div>`;
        }

        if (salida.participantes.length > 0) {
            html += `<div class="detalle-item"><strong>Participantes:</strong><table class="participante-tabla"><tr><th>Nombre</th>`;
            if (esAdminOGuia) {
                html += `<th>RUT</th><th>Ficha Médica</th>`;
            }
            html += `<th>Rol</th></tr>`;
            salida.participantes.forEach(p => {
                html += `<tr><td>${p.nombre}</td>`;
                if (esAdminOGuia) {
                    html += `<td>${p.rut}</td>`;
                    html += `<td><button onclick="verFichaMedica('${p.rut}')" style="background:none;border:1px solid #000;cursor:pointer;">Ver</button></td>`;
                }
                html += `<td>${p.rol}</td></tr>`;
            });
            html += `</table></div>`;
        }

        if (salida.guias.length > 0) {
            html += `<div class="detalle-item"><strong>Guía(s):</strong> ${salida.guias.map(g => g.nombre).join(', ')}</div>`;
        }
        if (salida.precio) html += `<div class="detalle-item"><strong>Precio:</strong> $${salida.precio}</div>`;
        if (salida.curso) html += `<div class="detalle-item"><strong>Curso:</strong> ${salida.curso}</div>`;
        if (salida.menu) html += `<div class="detalle-item"><strong>Menú:</strong> ${salida.menu}</div>`;

        if (salida.transporte) {
            const t = salida.transporte;
            html += `<div class="detalle-item"><strong>Transporte</strong></div>`;
            if (t.conductor) html += `<div class="detalle-item">Conductor: ${t.conductor}</div>`;
            if (t.horarios) html += `<div class="detalle-item">Horarios: ${t.horarios}</div>`;
            if (t.precio) html += `<div class="detalle-item">Precio servicio: ${t.precio}</div>`;
            if (t.descripcion) html += `<div class="detalle-item">Descripción: ${t.descripcion}</div>`;
        }

        if (esEstudiante) {
            const yaInscrito = salida.participantes.some(p => p.rut === usuario.rut);
            if (!yaInscrito && salida.fecha >= new Date().toISOString().split('T')[0]) {
                html += `<button class="btn" id="btnInscribir" onclick="inscribirEnSalida('${salida.id}')" style="margin-top:10px; background:#000; color:#fff; border:1px solid #000; padding:8px 20px; cursor:pointer;">✅ Inscribirme</button>`;
            } else if (yaInscrito) {
                html += `<p style="margin-top:10px; color:green; font-weight:bold;">✅ Ya estás inscrito en esta salida.</p>`;
            }
        }

        body.innerHTML = html;
        modal.style.display = 'flex';
    }

    async function verFichaMedica(rut) {
        const datos = await GitHub.leer('datos/usuarios.json');
        if (!datos) return alert('No se pudo cargar la información');
        const usuario = datos.usuarios.find(u => u.rut === rut);
        if (usuario) {
            alert(`Ficha médica de ${usuario.nombre} ${usuario.apellido}:\n${usuario.historial || 'Sin información'}`);
        } else {
            alert('Usuario no encontrado');
        }
    }

    window.verDetalles = verDetalles;
    window.inscribirEnSalida = inscribirEnSalida;
    window.verFichaMedica = verFichaMedica;

    // ============================================================
    // INSCRIPCIÓN EN SALIDA
    // ============================================================
    async function inscribirEnSalida(id) {
        const usuario = Auth.getSesion();
        if (!usuario) return;
        const salidas = await Planificacion.cargarSalidas();
        const salida = salidas.find(s => s.id === id);
        if (!salida) {
            alert('Salida no encontrada');
            return;
        }
        if (salida.participantes && salida.participantes.some(p => p.rut === usuario.rut)) {
            alert('Ya estás inscrito');
            return;
        }
        const nuevoParticipante = {
            nombre: `${usuario.nombre} ${usuario.apellido || ''}`.trim(),
            rut: usuario.rut,
            rol: usuario.rol === 'estudiante' ? 'Estudiante' : 'Visitante'
        };
        if (!salida.participantes) salida.participantes = [];
        salida.participantes.push(nuevoParticipante);
        const ok = await Planificacion.actualizarSalida(id, { participantes: salida.participantes });
        if (ok) {
            alert('✅ Inscripción exitosa');
            document.getElementById('modalDetalles').style.display = 'none';
            cargarYMostrarSalidas();
        } else {
            alert('❌ Error al inscribir');
        }
    }

    // ============================================================
    // CERRAR MODAL
    // ============================================================
    document.getElementById('modalCerrar').addEventListener('click', function() {
        document.getElementById('modalDetalles').style.display = 'none';
    });
    window.addEventListener('click', function(e) {
        if (e.target === document.getElementById('modalDetalles')) {
            document.getElementById('modalDetalles').style.display = 'none';
        }
    });

    // ============================================================
    // MAIN
    // ============================================================
    (function() {
        const usuario = Auth.getSesion();
        if (!usuario) {
            window.location.href = 'login.html';
            return;
        }

        document.getElementById('userNombre').textContent = `${usuario.nombre} ${usuario.apellido || ''}`;
        document.getElementById('userRol').textContent = usuario.rol;

        const nav = document.getElementById('navBotones');
        let botones = [];
        switch (usuario.rol) {
            case 'admin':
                botones.push({ texto: '👑 Panel de Administración', href: 'pages/dashboard.html' });
                botones.push({ texto: '📋 Planificar Salida', href: 'Planificar_Salida_Pedagogica.html' });
                botones.push({ texto: '📅 Calendario', href: 'calendario_interactivo_personal.html' });
                break;
            case 'guia':
            case 'asistente':
                botones.push({ texto: '📋 Planificar Salida', href: 'Planificar_Salida_Pedagogica.html' });
                botones.push({ texto: '📅 Calendario', href: 'calendario_interactivo_personal.html' });
                break;
            default:
                botones.push({ texto: '📅 Calendario', href: 'calendario_interactivo_personal.html' });
                break;
        }
        botones.forEach(b => {
            const btn = document.createElement('button');
            btn.textContent = b.texto;
            if (b.href) {
                btn.onclick = function() { window.location.href = b.href; };
            }
            nav.appendChild(btn);
        });

        window.cargarYMostrarSalidas = async function() {
            const contenedor = document.getElementById('contenedorSalidas');
            try {
                const todas = await Planificacion.cargarSalidas();
                const salidasVisibles = getSalidasVisibles(todas, usuario);
                if (salidasVisibles.length === 0) {
                    contenedor.innerHTML = `
                        <div class="mensaje-vacio">
                            <p>📭 No hay salidas disponibles para ti.</p>
                            <p style="margin-top:10px; font-size:0.9rem;">
                                ${usuario.rol === 'admin' || usuario.rol === 'guia' || usuario.rol === 'asistente'
                                    ? 'Puedes crear una desde "Planificar Salida" o esperar a que te inviten.'
                                    : 'Espera a que un guía te inscriba en una salida.'}
                            </p>
                        </div>
                    `;
                    return;
                }
                const ordenadas = salidasVisibles.sort((a,b) => (a.fecha > b.fecha) ? 1 : -1);
                const mostradas = ordenadas.slice(0, 3);
                contenedor.innerHTML = mostradas.map(s => {
                    const salidaJson = JSON.stringify(s).replace(/"/g, '&quot;');
                    return `
                        <div class="tarjeta">
                            <h3>${s.titulo || 'Sin título'}</h3>
                            <p>${s.descripcion || 'Sin descripción'}</p>
                            <p><small>📅 ${s.fecha || 'Fecha no definida'}</small></p>
                            <p><small>👤 ${s.guias.length > 0 ? s.guias.map(g => g.nombre).join(', ') : 'Sin guía'}</small></p>
                            <button onclick="verDetalles(${salidaJson})">Ver más</button>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error al cargar salidas:', error);
                contenedor.innerHTML = `<div class="mensaje-vacio"><p>⚠️ Error al cargar las salidas.</p></div>`;
            }
        };

        cargarYMostrarSalidas();

        document.getElementById('btnCerrarSesion').addEventListener('click', function() {
            Auth.cerrarSesion();
        });
    })();
</script>
</body>
</html>
