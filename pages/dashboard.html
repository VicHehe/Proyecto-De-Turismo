<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
<div class="container">
    <div class="dashboard-header">
        <h1>👑 Panel de Administración</h1>
        <div class="header-actions">
            <button class="btn btn-index" id="btnIrIndex">🏠 Ir al Inicio</button>
            <span class="user-count-badge" id="userCount">0 usuarios</span>
            <button class="btn btn-excel" id="btnExportarExcel">📊 Exportar a Excel</button>
            <button class="btn logout-btn" id="btnCerrarSesion">Cerrar Sesión</button>
        </div>
    </div>
    
    <div class="search-box">
        <span class="lupa">🔍</span>
        <input type="text" id="buscarUsuario" placeholder="Buscar por RUT, nombre o apellido..." />
        <button class="btn btn-small" id="btnBuscar">Buscar</button>
    </div>
    
    <div id="dashboardMensaje" class="mensaje hidden"></div>
    
    <h2>Lista de Usuarios</h2>
    <div class="user-table-container">
        <table class="user-table" id="tablaUsuarios">
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>RUT</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
                <tr>
                    <td colspan="7" class="text-center">Cargando usuarios...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL PARA EDITAR USUARIO -->
<div id="modalEditar" class="modal">
    <div class="modal-contenido">
        <h2>✏️ Editar Usuario</h2>
        <form id="formEditar">
            <input type="hidden" id="editRut" />
            <div class="campo">
                <label>Nombre</label>
                <input type="text" id="editNombre" required />
            </div>
            <div class="campo">
                <label>Apellido</label>
                <input type="text" id="editApellido" required />
            </div>
            <div class="campo">
                <label>Edad</label>
                <input type="number" id="editEdad" required min="1" max="120" />
            </div>
            <div class="campo">
                <label>Teléfono</label>
                <input type="text" id="editTelefono" placeholder="912345678" required />
            </div>
            <div class="campo">
                <label>Gmail</label>
                <input type="email" id="editGmail" required />
            </div>
            <div class="campo">
                <label>Historial Médico</label>
                <textarea id="editHistorial" rows="2"></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cerrar" id="btnCerrarModal">Cancelar</button>
                <button type="submit" class="btn-guardar">💾 Guardar cambios</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById('btnIrIndex').addEventListener('click', function() {
        window.location.href = '../index.html';
    });
</script>

<script src="../js/github.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
