<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
<div class="container">
    <div class="header">
        <h1>👑 Panel de Administración</h1>
        <div class="header-actions">
            <button class="btn btn-index" id="btnIrIndex">🏠 Ir al Inicio</button>
            <button class="btn btn-export" id="btnExportarExcel">📊 Exportar a Excel</button>
            <span class="user-count" id="userCount">0 usuarios</span>
            <button class="btn logout-btn" id="btnCerrarSesion">Cerrar Sesión</button>
        </div>
    </div>
    
    <p>Gestión de usuarios del sistema.</p>
    
    <div id="dashboardMensaje" class="mensaje hidden"></div>
    
    <div class="search-bar">
        <input type="text" id="buscarUsuario" placeholder="🔍 Buscar por RUT o nombre..." />
        <button class="btn btn-small" id="btnBuscar">Buscar</button>
    </div>
    
    <h2>Lista de Usuarios</h2>
    <div id="tablaUsuariosWrapper">
        <ul class="user-list" id="listaUsuarios">
            <li>Cargando usuarios...</li>
        </ul>
    </div>
</div>

<!-- ===== MODAL DE EDICIÓN ===== -->
<div id="modalEditarUsuario" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="modal-close" id="modalEditarCerrar">&times;</span>
        <h2>✏️ Editar Usuario</h2>
        <div id="modalEditarBody"></div>
        <div class="modal-botones">
            <button class="btn" id="btnEditarCancelar">Cancelar</button>
            <button class="btn btn-primario" id="btnEditarGuardar">💾 Guardar Cambios</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('btnIrIndex').addEventListener('click', function() {
        window.location.href = '../index.html';
    });
</script>

<script src="../js/github.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
