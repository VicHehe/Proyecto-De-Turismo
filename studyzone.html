<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 StudyZone - Aprende sobre los lugares</title>
    <link rel="stylesheet" href="css/studyzone.css">
</head>
<body>

<header>
    <h1>🌍 StudyZone</h1>
    <div style="display: flex; align-items: center; gap: 12px;">
        <span class="user-badge" id="userBadge">Cargando...</span>
        <a href="index.html" class="volver">← Volver al Lobby</a>
    </div>
</header>

<main class="studyzone-container">
    <h2>📍 Descubre los lugares turísticos</h2>
    <p class="subtitulo">Información detallada para planificar tus guías y aprender sobre la región.</p>

    <div id="contenedorLugares" class="grid-lugares">
        <!-- Se llena con JavaScript desde lugares.js -->
        <p class="cargando">Cargando lugares...</p>
    </div>
</main>

<footer>
    © 2026 Turismo Eduardo Charme · StudyZone
</footer>

<script src="js/lugares.js"></script>
<script>
    (function() {
        // Verificar sesión
        const usuarioStr = sessionStorage.getItem('cc_sesion');
        if (!usuarioStr) {
            window.location.href = 'login.html';
            return;
        }
        const usuario = JSON.parse(usuarioStr);
        document.getElementById('userBadge').textContent = `${usuario.nombre} ${usuario.apellido || ''} (${usuario.rol})`;

        // Renderizar lugares
        const contenedor = document.getElementById('contenedorLugares');
        
        if (typeof lugares === 'undefined' || !lugares || lugares.length === 0) {
            contenedor.innerHTML = `<p class="error">No hay lugares disponibles en la base de datos.</p>`;
            return;
        }

        // Ordenar alfabéticamente
        const lugaresOrdenados = [...lugares].sort((a, b) => a.nombre.localeCompare(b.nombre));

        let html = '';
        lugaresOrdenados.forEach(lugar => {
            // Escapar HTML para evitar inyecciones
            const nombre = lugar.nombre || 'Sin nombre';
            const descripcion = lugar.descripcion || 'Sin descripción';
            const ubicacion = lugar.ubicacion || 'Ubicación no especificada';
            const apertura = lugar.apertura || 'N/A';
            const cierre = lugar.cierre || 'N/A';
            const miniatura = lugar.miniatura || '';

            // Si la miniatura está vacía, usamos un placeholder de texto
            const imgSrc = miniatura || '';

            html += `
                <div class="tarjeta-lugar">
                    <div class="imagen-container">
                        <img 
                            src="${imgSrc}" 
                            alt="${nombre}"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                        >
                        <div class="placeholder" style="display: ${imgSrc ? 'none' : 'flex'};">
                            <span>${nombre}</span>
                        </div>
                    </div>
                    <div class="info">
                        <h3>${nombre}</h3>
                        <p class="descripcion">${descripcion}</p>
                        <div class="detalles">
                            <p><strong>📍 Ubicación:</strong> ${ubicacion}</p>
                            <p><strong>🕒 Horario:</strong> ${apertura} - ${cierre}</p>
                        </div>
                    </div>
                </div>
            `;
        });

        contenedor.innerHTML = html;

        // Manejar error de carga de imágenes (fallback)
        document.querySelectorAll('.tarjeta-lugar img').forEach(img => {
            img.addEventListener('error', function() {
                this.style.display = 'none';
                const placeholder = this.nextElementSibling;
                if (placeholder && placeholder.classList.contains('placeholder')) {
                    placeholder.style.display = 'flex';
                }
            });
        });

        console.log('✅ StudyZone cargado correctamente');
    })();
</script>
</body>
</html>
