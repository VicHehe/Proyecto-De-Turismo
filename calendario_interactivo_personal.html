<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Personal</title>
    <link rel="stylesheet" href="css/calendario.css">
</head>
<body>

<header>
    <h1>📅 Calendario Personal</h1>
    <div style="display: flex; align-items: center; gap: 12px;">
        <span class="user-badge" id="userBadge">Cargando...</span>
        <a href="index.html" class="volver">← Volver</a>
    </div>
</header>

<div class="calendario-wrap">
    <div class="calendario">
        <div class="cal-header">
            <button id="btnMesAnterior">◀</button>
            <span id="mesTitulo">Julio 2026</span>
            <button id="btnMesSiguiente">▶</button>
        </div>
        <div class="dias-semana">
            <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
        </div>
        <div class="dias-grid" id="diasGrid">
            <!-- Se llena con JS -->
        </div>
    </div>

    <div class="detalle" id="panelDetalle">
        <h2>Detalle del día</h2>
        <div id="contenidoDetalle">
            <p class="no-eventos">Selecciona un día con eventos para ver los detalles.</p>
        </div>
    </div>
</div>

<footer>
    Nota: El calendario muestra las salidas según tu rol y participación.
</footer>

<script src="js/github.js"></script>
<script src="js/auth.js"></script>
<script src="js/planificacion.js"></script>
<script>
    (function() {
        const usuario = Auth.getSesion();
        if (!usuario) {
            window.location.href = 'login.html';
            return;
        }
        document.getElementById('userBadge').textContent = `${usuario.nombre} ${usuario.apellido || ''} (${usuario.rol})`;

        let mesActual = new Date().getMonth();
        let añoActual = new Date().getFullYear();

        // ============================================================
        // FUNCIÓN DE FILTRO DE SALIDAS (igual que en index)
        // ============================================================
        function getSalidasVisibles(todas, usuario) {
            const hoy = new Date().toISOString().split('T')[0];
            todas.forEach(s => {
                if (!s.guias) s.guias = [];
                if (!s.participantes) s.participantes = [];
            });

            if (usuario.rol === 'admin') {
                return todas;
            } else if (usuario.rol === 'guia' || usuario.rol === 'asistente') {
                return todas.filter(s => {
                    const esGuia = s.guias.some(g => g.rut === usuario.rut);
                    const esParticipante = s.participantes.some(p => p.rut === usuario.rut);
                    return (esGuia || esParticipante) && s.fecha >= hoy;
                });
            } else {
                return todas.filter(s => {
                    const esParticipante = s.participantes.some(p => p.rut === usuario.rut);
                    return esParticipante && s.fecha >= hoy;
                });
            }
        }

        async function cargarSalidas() {
            const todas = await Planificacion.cargarSalidas();
            return getSalidasVisibles(todas, usuario);
        }

        function renderizarCalendario(mes, año, salidas) {
            const grid = document.getElementById('diasGrid');
            const titulo = document.getElementById('mesTitulo');
            const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            titulo.textContent = `${meses[mes]} ${año}`;

            const primerDia = new Date(año, mes, 1).getDay(); // 0 domingo
            const diasEnMes = new Date(año, mes + 1, 0).getDate();
            const diasEnMesAnterior = new Date(año, mes, 0).getDate();

            let inicio = primerDia === 0 ? 6 : primerDia - 1;
            let html = '';

            // Días vacíos
            for (let i = 0; i < inicio; i++) {
                const diaAnterior = diasEnMesAnterior - inicio + 1 + i;
                html += `<div class="dia vacio"><span class="num-dia">${diaAnterior}</span></div>`;
            }

            // Días del mes
            for (let d = 1; d <= diasEnMes; d++) {
                const fecha = `${año}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const eventos = salidas.filter(s => s.fecha === fecha);
                let eventoHtml = '';
                if (eventos.length > 0) {
                    const maxMostrar = 2;
                    const mostrar = eventos.slice(0, maxMostrar);
                    mostrar.forEach(e => {
                        eventoHtml += `<div class="evento">${e.titulo || 'Sin título'}</div>`;
                    });
                    if (eventos.length > maxMostrar) {
                        eventoHtml += `<div class="evento multiple">+${eventos.length - maxMostrar} más</div>`;
                    }
                }
                html += `<div class="dia${eventoHtml ? ' tiene-evento' : ''}" data-fecha="${fecha}">
                    <span class="num-dia">${d}</span>
                    ${eventoHtml}
                </div>`;
            }

            // Completar última semana
            const totalCeldas = inicio + diasEnMes;
            const sobrante = (7 - (totalCeldas % 7)) % 7;
            for (let i = 1; i <= sobrante; i++) {
                html += `<div class="dia vacio"><span class="num-dia">${i}</span></div>`;
            }

            grid.innerHTML = html;

            // Eventos de clic en días con eventos
            document.querySelectorAll('.dia:not(.vacio)').forEach(el => {
                const fecha = el.dataset.fecha;
                if (fecha) {
                    const salidasDelDia = salidas.filter(s => s.fecha === fecha);
                    if (salidasDelDia.length > 0) {
                        el.style.cursor = 'pointer';
                        el.addEventListener('click', function() {
                            mostrarDetalleDia(salidasDelDia, fecha);
                        });
                    }
                }
            });
        }

        function mostrarDetalleDia(salidas, fecha) {
            const panel = document.getElementById('contenidoDetalle');
            if (salidas.length === 0) {
                panel.innerHTML = `<p class="no-eventos">No hay eventos este día.</p>`;
                return;
            }
            const esAdminOGuia = usuario.rol === 'admin' || usuario.rol === 'guia' || usuario.rol === 'asistente';
            let html = `<h3>${fecha}</h3>`;
            salidas.forEach(s => {
                html += `
                    <div class="tarjeta">
                        <div class="titulo">${s.titulo || 'Sin título'}</div>
                        <div class="etiqueta">${s.duracion || '1 día'}</div>
                        <p>${s.descripcion || ''}</p>
                        <ul>
                            ${s.ruta ? s.ruta.map(r => `<li>${r.tipo}: ${r.descripcion} (${r.inicio} - ${r.fin})</li>`).join('') : '<li>Sin ruta definida</li>'}
                        </ul>
                        <p><strong>Guía(s):</strong> ${s.guias.length > 0 ? s.guias.map(g => g.nombre).join(', ') : 'No asignado'}</p>
                        <p><strong>Participantes:</strong> ${s.participantes.length}</p>
                        ${esAdminOGuia && s.participantes.length > 0 ? `<p><strong>Detalle:</strong> ${s.participantes.map(p => p.nombre).join(', ')}</p>` : ''}
                        ${esAdminOGuia ? `<button onclick="verFichaMedica('${s.id}')" style="background:none;border:1px solid #000;cursor:pointer;">Ver fichas médicas</button>` : ''}
                        <button onclick="window.location.href='index.html'">Ver en el Lobby</button>
                    </div>
                `;
            });
            panel.innerHTML = html;
        }

        // Función para ver fichas médicas de todos los participantes (solo admin/guia/asistente)
        async function verFichaMedica(salidaId) {
            const todas = await Planificacion.cargarSalidas();
            const salida = todas.find(s => s.id === salidaId);
            if (!salida) return alert('Salida no encontrada');
            const rutas = salida.participantes.map(p => p.rut);
            const datos = await GitHub.leer('datos/usuarios.json');
            if (!datos) return alert('No se pudo cargar la información');
            let mensaje = 'Fichas médicas de los participantes:\n\n';
            rutas.forEach(rut => {
                const user = datos.usuarios.find(u => u.rut === rut);
                if (user) {
                    mensaje += `${user.nombre} ${user.apellido} (${rut}): ${user.historial || 'Sin información'}\n`;
                }
            });
            alert(mensaje);
        }
        window.verFichaMedica = verFichaMedica;

        // Navegación meses
        document.getElementById('btnMesAnterior').addEventListener('click', () => {
            mesActual--;
            if (mesActual < 0) { mesActual = 11; añoActual--; }
            cargarYRenderizar();
        });
        document.getElementById('btnMesSiguiente').addEventListener('click', () => {
            mesActual++;
            if (mesActual > 11) { mesActual = 0; añoActual++; }
            cargarYRenderizar();
        });

        async function cargarYRenderizar() {
            const salidas = await cargarSalidas();
            renderizarCalendario(mesActual, añoActual, salidas);
        }

        cargarYRenderizar();
    })();
</script>
</body>
</html>
