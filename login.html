<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestión de Salidas</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-box">
    <h1>🔐 Sistema de Gestión</h1>
    <p>Salidas y Excursiones</p>

    <div class="tab-btns">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Iniciar sesión</button>
        <button class="tab-btn" id="tabRegistro" onclick="switchTab('registro')">Registrarse</button>
    </div>

    <!-- PANEL LOGIN -->
    <div id="panelLogin">
        <div class="field">
            <label>RUT (con guión)</label>
            <input type="text" id="loginRut" placeholder="Ej: 12345678-9">
        </div>
        <div class="field">
            <label>Contraseña</label>
            <input type="password" id="loginPass" placeholder="********">
        </div>
        <button class="btn-submit" id="btnLogin" onclick="login()">Iniciar sesión</button>
        <div class="msg" id="loginMsg"></div>
    </div>

    <!-- PANEL REGISTRO -->
    <div id="panelRegistro" style="display:none;">
        <div class="form-row">
            <div class="field">
                <label>Nombre</label>
                <input type="text" id="regNombre" placeholder="Tu nombre">
            </div>
            <div class="field">
                <label>Apellido</label>
                <input type="text" id="regApellido" placeholder="Tu apellido">
            </div>
        </div>
        <div class="form-row">
            <div class="field">
                <label>Edad</label>
                <input type="number" id="regEdad" placeholder="18">
            </div>
            <div class="field">
                <label>RUT (con guión)</label>
                <input type="text" id="regRut" placeholder="Ej: 12345678-9">
            </div>
        </div>
        <div class="form-row">
            <div class="field">
                <label>Teléfono</label>
                <input type="text" id="regTelefono" placeholder="912345678">
            </div>
            <div class="field">
                <label>Gmail</label>
                <input type="email" id="regGmail" placeholder="ejemplo@gmail.com">
            </div>
        </div>
        <div class="field">
            <label>Historial médico</label>
            <input type="text" id="regHistorial" placeholder="Alergias, condiciones, etc.">
        </div>
        <div class="field">
            <label>Contraseña</label>
            <input type="password" id="regPass" placeholder="********">
        </div>
        <div class="field">
            <label>Confirmar contraseña</label>
            <input type="password" id="regPass2" placeholder="********">
        </div>
        <div class="rol-info">⚠️ Si tu RUT está autorizado, obtendrás ese rol. Si no, serás Visitante.</div>
        <button class="btn-submit" id="btnRegistro" onclick="registro()">Crear cuenta</button>
        <div class="msg" id="registroMsg"></div>
    </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="js/github.js"></script>
<script src="js/auth.js"></script>

<script>
    // ============================================================
    // CÓDIGO DE LOGIN Y REGISTRO
    // ============================================================

    if (typeof Auth === 'undefined') {
        document.body.innerHTML = '<h1>Error: Auth no está definido</h1><p>Revisa que auth.js se haya cargado correctamente.</p>';
        console.error('❌ Auth no está definido');
    } else {
        console.log('✅ Auth cargado correctamente');
    }

    function switchTab(tab) {
        const esLogin = tab === 'login';
        document.getElementById('panelLogin').style.display = esLogin ? 'block' : 'none';
        document.getElementById('panelRegistro').style.display = esLogin ? 'none' : 'block';
        document.querySelectorAll('.tab-btn').forEach((b, i) => {
            b.classList.toggle('active', esLogin ? i === 0 : i === 1);
        });
        document.getElementById('loginMsg').className = 'msg';
        document.getElementById('loginMsg').style.display = 'none';
        document.getElementById('registroMsg').className = 'msg';
        document.getElementById('registroMsg').style.display = 'none';
    }

    function mostrarMsg(id, texto, tipo) {
        const el = document.getElementById(id);
        el.textContent = texto;
        el.className = `msg ${tipo}`;
        el.style.display = 'block';
    }

    function setLoading(btnId, loading) {
        const btn = document.getElementById(btnId);
        btn.disabled = loading;
        btn.textContent = loading ? 'Cargando...' : btnId === 'btnLogin' ? 'Iniciar sesión' : 'Crear cuenta';
    }

    // ===== LOGIN =====
    async function login() {
        const rut = document.getElementById('loginRut').value.trim();
        const pass = document.getElementById('loginPass').value;
        
        if (!rut || !pass) {
            return mostrarMsg('loginMsg', 'Completá todos los campos', 'error');
        }

        if (typeof Auth === 'undefined') {
            return mostrarMsg('loginMsg', 'Error: Auth no está definido', 'error');
        }

        setLoading('btnLogin', true);
        try {
            const res = await Auth.login(rut, pass);
            setLoading('btnLogin', false);
            if (!res.ok) {
                return mostrarMsg('loginMsg', res.error, 'error');
            }
        } catch (error) {
            setLoading('btnLogin', false);
            mostrarMsg('loginMsg', 'Error: ' + error.message, 'error');
        }
    }

    // ===== REGISTRO CON VALIDACIONES MEJORADAS =====
    async function registro() {
        // Obtener valores y limpiar espacios
        let nombre = document.getElementById('regNombre').value.trim();
        let apellido = document.getElementById('regApellido').value.trim();
        let edad = document.getElementById('regEdad').value.trim();
        let rut = document.getElementById('regRut').value.trim();
        let telefono = document.getElementById('regTelefono').value.trim();
        let gmail = document.getElementById('regGmail').value.trim();
        let historial = document.getElementById('regHistorial').value.trim();
        let pass = document.getElementById('regPass').value;
        let pass2 = document.getElementById('regPass2').value;

        // --- VALIDACIONES ---

        // 1. Nombre y apellido (solo letras y espacios, no vacíos)
        if (!nombre) return mostrarMsg('registroMsg', 'El nombre es obligatorio.', 'error');
        if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(nombre)) {
            return mostrarMsg('registroMsg', 'El nombre solo puede contener letras y espacios.', 'error');
        }
        if (!apellido) return mostrarMsg('registroMsg', 'El apellido es obligatorio.', 'error');
        if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(apellido)) {
            return mostrarMsg('registroMsg', 'El apellido solo puede contener letras y espacios.', 'error');
        }

        // 2. Edad (número entero positivo)
        if (!edad) return mostrarMsg('registroMsg', 'La edad es obligatoria.', 'error');
        const edadNum = parseInt(edad);
        if (isNaN(edadNum) || edadNum < 1 || edadNum > 120) {
            return mostrarMsg('registroMsg', 'Ingresa una edad válida (1-120).', 'error');
        }

        // 3. RUT (formato chileno: 12345678-9 o 12345678-k)
        // Limpiar puntos y espacios, dejar solo dígitos y guión
        rut = rut.replace(/\./g, '').replace(/\s/g, '');
        if (!rut) return mostrarMsg('registroMsg', 'El RUT es obligatorio.', 'error');
        if (!/^\d{7,8}-[\dkK]$/.test(rut)) {
            return mostrarMsg('registroMsg', 'RUT inválido. Debe tener el formato 12345678-9 (con guión).', 'error');
        }
        // Guardamos el RUT ya formateado en el campo (para que el usuario vea la corrección)
        document.getElementById('regRut').value = rut;

        // 4. Teléfono (solo dígitos, mínimo 9 dígitos)
        let telefonoLimpio = telefono.replace(/[\s\-\(\)\+]/g, '');
        if (!telefonoLimpio) return mostrarMsg('registroMsg', 'El teléfono es obligatorio.', 'error');
        if (!/^\d{9,15}$/.test(telefonoLimpio)) {
            return mostrarMsg('registroMsg', 'Teléfono inválido. Debe tener al menos 9 dígitos (ej: 912345678).', 'error');
        }
        // Si tiene 11 dígitos y empieza con 56, quitar el 56 inicial
        if (telefonoLimpio.length === 11 && telefonoLimpio.startsWith('56')) {
            telefonoLimpio = telefonoLimpio.substring(2);
        }
        document.getElementById('regTelefono').value = telefonoLimpio;

        // 5. Correo electrónico (formato básico)
        if (!gmail) return mostrarMsg('registroMsg', 'El correo electrónico es obligatorio.', 'error');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(gmail)) {
            return mostrarMsg('registroMsg', 'Correo electrónico inválido (ej: usuario@dominio.com).', 'error');
        }

        // 6. Historial (puede estar vacío, pero si tiene texto, solo letras y espacios)
        if (historial && !/^[a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\s,.;:()\-]+$/.test(historial)) {
            return mostrarMsg('registroMsg', 'El historial médico contiene caracteres no permitidos.', 'error');
        }

        // 7. Contraseña
        if (!pass) return mostrarMsg('registroMsg', 'La contraseña es obligatoria.', 'error');
        if (pass.length < 6) {
            return mostrarMsg('registroMsg', 'La contraseña debe tener al menos 6 caracteres.', 'error');
        }
        if (pass !== pass2) {
            return mostrarMsg('registroMsg', 'Las contraseñas no coinciden.', 'error');
        }

        // --- Si todo está bien, llamar a Auth.registro ---
        if (typeof Auth === 'undefined') {
            return mostrarMsg('registroMsg', 'Error: Auth no está definido', 'error');
        }

        setLoading('btnRegistro', true);
        try {
            const res = await Auth.registro(
                rut,                      // RUT ya formateado
                nombre,
                apellido,
                edadNum,                  // Edad como número
                telefonoLimpio,           // Teléfono formateado
                gmail,
                historial,
                pass
            );
            setLoading('btnRegistro', false);
            if (!res.ok) {
                return mostrarMsg('registroMsg', res.error, 'error');
            }

            const mensajeRol = res.rol === 'visitante' 
                ? '✅ Cuenta creada como Visitante. Un administrador puede cambiar tu rol.' 
                : `✅ Cuenta creada como ${res.rol.toUpperCase()}`;
            
            mostrarMsg('registroMsg', mensajeRol, 'success');
            // Limpiar campos
            document.querySelectorAll('#panelRegistro input').forEach(input => input.value = '');
            
            setTimeout(() => {
                switchTab('login');
                mostrarMsg('loginMsg', '✅ Registro exitoso. Inicia sesión.', 'success');
            }, 2000);
        } catch (error) {
            setLoading('btnRegistro', false);
            mostrarMsg('registroMsg', 'Error: ' + error.message, 'error');
        }
    }

    // Eventos de teclado para enviar con Enter
    document.getElementById('loginPass').addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });
    document.getElementById('regPass2').addEventListener('keydown', e => {
        if (e.key === 'Enter') registro();
    });

    console.log('✅ login.html cargado correctamente');
</script>
</body>
</html>
