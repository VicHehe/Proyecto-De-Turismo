<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧭 Asistente IA de Turismo</title>
    <link rel="stylesheet" href="css/asistente_turismo.css">
    <!-- Librerías para PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<header>
    <h1>🧭 Asistente de Turismo</h1>
    <div class="header-right">
        <span class="user-badge" id="userBadge">Cargando...</span>
        <a href="index.html" class="volver">← Volver al Lobby</a>
    </div>
</header>

<div class="chat-container">
    <!-- Área del chat -->
    <div id="chatArea" class="chat-area">
        <div class="mensaje-bienvenida">
            <div class="burbuja asistente">
                👋 ¡Hola! Soy tu asistente de turismo. Pregúntame sobre salidas, lugares o participantes.
                <br><small>Usa los botones de abajo o escribe tu pregunta.</small>
            </div>
        </div>
    </div>

    <!-- Botones de preguntas rápidas -->
    <div class="preguntas-rapidas">
        <button class="btn-pregunta" data-pregunta="salidas_hoy">📅 Salidas de hoy</button>
        <button class="btn-pregunta" data-pregunta="salidas_manana">📅 Salidas de mañana</button>
        <button class="btn-pregunta" data-pregunta="salidas_mes">📅 Salidas de este mes</button>
        <button class="btn-pregunta" data-pregunta="lugares">📍 Lugares turísticos</button>
        <button class="btn-pregunta" data-pregunta="participantes">👥 Participantes de una salida</button>
        <button class="btn-pregunta" data-pregunta="detalle_salida">📋 Detalle de una salida</button>
        <button class="btn-pregunta" data-pregunta="ayuda">❓ Ayuda</button>
    </div>

    <!-- Input del chat -->
    <div class="chat-input">
        <input type="text" id="inputMensaje" placeholder="Escribe tu pregunta...">
        <button id="btnEnviar">➤</button>
    </div>
</div>

<script src="js/github.js"></script>
<script src="js/auth.js"></script>
<script src="js/planificacion.js"></script>
<script src="js/lugares.js"></script>

<script>
    (function() {
        // ===== AUTH =====
        const usuario = Auth.getSesion();
        if (!usuario) { window.location.href = 'login.html'; return; }
        if (usuario.rol !== 'admin') {
            alert('Solo administradores pueden usar el asistente.');
            window.location.href = 'index.html';
            return;
        }
        document.getElementById('userBadge').textContent = `${usuario.nombre} ${usuario.apellido || ''} (${usuario.rol})`;

        // ===== STATE =====
        let todosUsuarios = [];
        let todasSalidas = [];
        let todosLugares = typeof lugares !== 'undefined' ? lugares : [];
        let chatMensajes = [];

        // ===== CARGAR DATOS =====
        async function cargarDatos() {
            try {
                const datosU = await GitHub.leer('datos/usuarios.json');
                todosUsuarios = datosU?.usuarios || [];
                todasSalidas = await Planificacion.cargarSalidas();
                todasSalidas.forEach(s => {
                    if (!s.guias) s.guias = [];
                    if (!s.participantes) s.participantes = [];
                });
                console.log('✅ Datos cargados correctamente.');
            } catch (e) {
                console.error('Error al cargar datos:', e);
                agregarMensaje('asistente', '⚠️ Error al cargar los datos. Recarga la página.');
            }
        }

        // ===== FUNCIONES DEL CHAT =====
        function agregarMensaje(tipo, contenido, extra = '') {
            const area = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = `mensaje-chat ${tipo}`;
            const burbuja = document.createElement('div');
            burbuja.className = 'burbuja';
            if (tipo === 'asistente') {
                burbuja.innerHTML = contenido + extra;
            } else {
                burbuja.textContent = contenido;
            }
            div.appendChild(burbuja);
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
            chatMensajes.push({ tipo, contenido, extra });
        }

        function agregarMensajeAsistente(texto, extra = '') {
            agregarMensaje('asistente', texto, extra);
        }

        function agregarMensajeUsuario(texto) {
            agregarMensaje('usuario', texto);
        }

        // ===== PROCESAR PREGUNTAS =====
        function procesarPregunta(pregunta) {
            const q = pregunta.toLowerCase().trim();
            agregarMensajeUsuario(pregunta);

            // Manejar comandos predefinidos
            if (q.includes('salidas de hoy') || q === 'salidas_hoy') {
                responderSalidasHoy();
            } else if (q.includes('salidas de mañana') || q === 'salidas_manana') {
                responderSalidasManana();
            } else if (q.includes('salidas de este mes') || q === 'salidas_mes') {
                responderSalidasMes();
            } else if (q.includes('lugares') || q === 'lugares') {
                responderLugares();
            } else if (q.includes('participantes') || q === 'participantes') {
                responderParticipantes();
            } else if (q.includes('detalle') || q === 'detalle_salida') {
                responderDetalleSalida();
            } else if (q.includes('ayuda') || q === 'ayuda') {
                mostrarAyuda();
            } else {
                // Búsqueda general por palabras clave
                buscarGeneral(q);
            }
        }

        // ===== RESPONDER SALIDAS DE HOY =====
        function responderSalidasHoy() {
            const hoy = new Date().toISOString().split('T')[0];
            const salidas = todasSalidas.filter(s => s.fecha === hoy);
            if (salidas.length === 0) {
                agregarMensajeAsistente('📭 No hay salidas programadas para hoy.');
                return;
            }
            let texto = `📅 **Salidas de hoy (${hoy}):**\n\n`;
            salidas.forEach((s, i) => {
                texto += `${i+1}. **${s.titulo}** (${s.fecha}) - ${s.guias.length > 0 ? 'Guía: ' + s.guias.map(g => g.nombre).join(', ') : 'Sin guía'}\n`;
                texto += `   Participantes: ${s.participantes.length}\n`;
            });
            agregarMensajeAsistente(texto, generarBotonPDF(texto, 'Salidas de hoy'));
        }

        // ===== RESPONDER SALIDAS DE MAÑANA =====
        function responderSalidasManana() {
            const hoy = new Date();
            hoy.setDate(hoy.getDate() + 1);
            const manana = hoy.toISOString().split('T')[0];
            const salidas = todasSalidas.filter(s => s.fecha === manana);
            if (salidas.length === 0) {
                agregarMensajeAsistente(`📭 No hay salidas programadas para mañana (${manana}).`);
                return;
            }
            let texto = `📅 **Salidas de mañana (${manana}):**\n\n`;
            salidas.forEach((s, i) => {
                texto += `${i+1}. **${s.titulo}** (${s.fecha}) - ${s.guias.length > 0 ? 'Guía: ' + s.guias.map(g => g.nombre).join(', ') : 'Sin guía'}\n`;
                texto += `   Participantes: ${s.participantes.length}\n`;
            });
            agregarMensajeAsistente(texto, generarBotonPDF(texto, 'Salidas de mañana'));
        }

        // ===== RESPONDER SALIDAS DEL MES =====
        function responderSalidasMes() {
            const hoy = new Date();
            const mes = hoy.getMonth();
            const año = hoy.getFullYear();
            const salidas = todasSalidas.filter(s => {
                const fecha = new Date(s.fecha);
                return fecha.getMonth() === mes && fecha.getFullYear() === año;
            });
            if (salidas.length === 0) {
                agregarMensajeAsistente(`📭 No hay salidas programadas para este mes (${hoy.toLocaleString('es', { month: 'long' })}).`);
                return;
            }
            let texto = `📅 **Salidas de ${hoy.toLocaleString('es', { month: 'long' })} ${año}:**\n\n`;
            salidas.sort((a,b) => a.fecha.localeCompare(b.fecha));
            salidas.forEach((s, i) => {
                texto += `${i+1}. **${s.titulo}** (${s.fecha}) - Guía: ${s.guias.length > 0 ? s.guias.map(g => g.nombre).join(', ') : 'N/A'}\n`;
                texto += `   Participantes: ${s.participantes.length}\n`;
            });
            agregarMensajeAsistente(texto, generarBotonPDF(texto, 'Salidas del mes'));
        }

        // ===== RESPONDER LUGARES =====
        function responderLugares() {
            if (todosLugares.length === 0) {
                agregarMensajeAsistente('📍 No hay lugares turísticos registrados.');
                return;
            }
            let texto = '📍 **Lugares turísticos disponibles:**\n\n';
            todosLugares.forEach((l, i) => {
                texto += `${i+1}. **${l.nombre}** - ${l.ubicacion || 'Sin ubicación'}\n`;
                texto += `   Horario: ${l.apertura || 'N/A'} - ${l.cierre || 'N/A'}\n`;
                if (l.descripcion) texto += `   ${l.descripcion}\n`;
            });
            agregarMensajeAsistente(texto, generarBotonPDF(texto, 'Lista de lugares'));
        }

        // ===== RESPONDER PARTICIPANTES =====
        function responderParticipantes() {
            // Preguntar al usuario qué salida
            const salidas = todasSalidas;
            if (salidas.length === 0) {
                agregarMensajeAsistente('No hay salidas registradas.');
                return;
            }
            // Mostrar lista de salidas para que el usuario elija
            let texto = '👥 **Participantes:**\n\nEscribe el **nombre o ID** de la salida para ver sus participantes.\n\nSalidas disponibles:\n';
            salidas.forEach((s, i) => {
                texto += `${i+1}. ${s.titulo} (${s.fecha})\n`;
            });
            texto += '\nEjemplo: escribe "participantes de Termas del Flaco" o "participantes de salida_123"';
            agregarMensajeAsistente(texto);
            // Guardar contexto para la próxima respuesta
            window.contextoPregunta = 'participantes';
        }

        // ===== RESPONDER DETALLE DE SALIDA =====
        function responderDetalleSalida() {
            const salidas = todasSalidas;
            if (salidas.length === 0) {
                agregarMensajeAsistente('No hay salidas registradas.');
                return;
            }
            let texto = '📋 **Detalle de una salida:**\n\nEscribe el **nombre o ID** de la salida para ver sus detalles.\n\nSalidas disponibles:\n';
            salidas.forEach((s, i) => {
                texto += `${i+1}. ${s.titulo} (${s.fecha})\n`;
            });
            texto += '\nEjemplo: escribe "detalle de Termas del Flaco"';
            agregarMensajeAsistente(texto);
            window.contextoPregunta = 'detalle';
        }

        // ===== MOSTRAR AYUDA =====
        function mostrarAyuda() {
            let texto = `❓ **Comandos disponibles:**\n\n`;
            texto += `• "salidas de hoy" - Muestra las salidas de hoy.\n`;
            texto += `• "salidas de mañana" - Muestra las salidas de mañana.\n`;
            texto += `• "salidas de este mes" - Muestra las salidas del mes actual.\n`;
            texto += `• "lugares" - Lista todos los lugares turísticos.\n`;
            texto += `• "participantes" - Te guía para ver participantes de una salida.\n`;
            texto += `• "detalle de [nombre]" - Muestra detalles completos de una salida.\n`;
            texto += `• "ayuda" - Muestra este mensaje.\n`;
            texto += `\nTambién puedes escribir el nombre de una salida o lugar para buscar información.`;
            agregarMensajeAsistente(texto);
        }

        // ===== BÚSQUEDA GENERAL =====
        function buscarGeneral(q) {
            // Buscar en títulos de salidas
            const salidasEncontradas = todasSalidas.filter(s =>
                s.titulo.toLowerCase().includes(q) ||
                (s.descripcion && s.descripcion.toLowerCase().includes(q))
            );
            if (salidasEncontradas.length > 0) {
                let texto = `🔍 **Encontré ${salidasEncontradas.length} salida(s) relacionada(s):**\n\n`;
                salidasEncontradas.forEach((s, i) => {
                    texto += `${i+1}. **${s.titulo}** (${s.fecha})\n`;
                    texto += `   Guía: ${s.guias.length > 0 ? s.guias.map(g => g.nombre).join(', ') : 'N/A'}\n`;
                    texto += `   Participantes: ${s.participantes.length}\n`;
                    if (s.descripcion) texto += `   ${s.descripcion}\n`;
                });
                agregarMensajeAsistente(texto, generarBotonPDF(texto, 'Resultados de búsqueda'));
                return;
            }

            // Buscar en lugares
            const lugaresEncontrados = todosLugares.filter(l =>
                l.nombre.toLowerCase().includes(q) ||
                (l.descripcion && l.descripcion.toLowerCase().includes(q))
            );
            if (lugaresEncontrados.length > 0) {
                let texto = `📍 **Encontré ${lugaresEncontrados.length} lugar(es) relacionado(s):**\n\n`;
                lugaresEncontrados.forEach((l, i) => {
                    texto += `${i+1}. **${l.nombre}** - ${l.ubicacion || 'Sin ubicación'}\n`;
                    texto += `   Horario: ${l.apertura || 'N/A'} - ${l.cierre || 'N/A'}\n`;
                    if (l.descripcion) texto += `   ${l.descripcion}\n`;
                });
                agregarMensajeAsistente(texto, generarBotonPDF(texto, 'Lugares encontrados'));
                return;
            }

            // Si no hay nada
            agregarMensajeAsistente(`❌ No encontré información sobre "${q}".\nPrueba con "ayuda" para ver los comandos disponibles.`);
        }

        // ===== PROCESAR PREGUNTA DETALLE O PARTICIPANTES (contexto) =====
        function procesarContexto(q) {
            const ctx = window.contextoPregunta;
            if (ctx === 'participantes') {
                // Buscar salida por nombre o ID
                const salida = todasSalidas.find(s =>
                    s.titulo.toLowerCase().includes(q) ||
                    s.id.toLowerCase().includes(q)
                );
                if (!salida) {
                    agregarMensajeAsistente(`❌ No encontré una salida con "${q}".\nIntenta con otro nombre.`);
                    return;
                }
                const participantes = salida.participantes || [];
                if (participantes.length === 0) {
                    agregarMensajeAsistente(`👥 La salida "${salida.titulo}" no tiene participantes aún.`);
                } else {
                    let texto = `👥 **Participantes de "${salida.titulo}" (${salida.fecha}):**\n\n`;
                    participantes.forEach((p, i) => {
                        texto += `${i+1}. ${p.nombre || 'Sin nombre'} (${p.rut || 'Sin RUT'}) - ${p.rol || 'Visitante'}\n`;
                    });
                    agregarMensajeAsistente(texto, generarBotonPDF(texto, `Participantes de ${salida.titulo}`));
                }
                window.contextoPregunta = null;
            } else if (ctx === 'detalle') {
                const salida = todasSalidas.find(s =>
                    s.titulo.toLowerCase().includes(q) ||
                    s.id.toLowerCase().includes(q)
                );
                if (!salida) {
                    agregarMensajeAsistente(`❌ No encontré una salida con "${q}".\nIntenta con otro nombre.`);
                    return;
                }
                let texto = `📋 **Detalle de "${salida.titulo}"**\n\n`;
                texto += `📅 Fecha: ${salida.fecha || 'N/A'}\n`;
                texto += `⏳ Duración: ${salida.duracion || 'N/A'}\n`;
                texto += `📝 Descripción: ${salida.descripcion || 'Sin descripción'}\n`;
                texto += `👨‍🏫 Guía(s): ${salida.guias.length > 0 ? salida.guias.map(g => g.nombre).join(', ') : 'N/A'}\n`;
                texto += `👥 Participantes: ${salida.participantes.length}\n`;
                texto += `🚌 Transporte: Conductor: ${salida.transporte?.conductor || 'N/A'}, Horarios: ${salida.transporte?.horarios || 'N/A'}\n`;
                if (salida.ruta && salida.ruta.length > 0) {
                    texto += `📍 Ruta:\n`;
                    salida.ruta.forEach((act, i) => {
                        texto += `   ${i+1}. ${act.tipo}: ${act.descripcion} (${act.inicio || 'N/A'} - ${act.fin || 'N/A'})\n`;
                    });
                }
                agregarMensajeAsistente(texto, generarBotonPDF(texto, `Detalle de ${salida.titulo}`));
                window.contextoPregunta = null;
            }
        }

        // ===== GENERAR BOTÓN PARA EXPORTAR A PDF =====
        function generarBotonPDF(texto, titulo) {
            return `<br><button class="btn-pdf-chat" onclick="exportarRespuestaPDF('${encodeURIComponent(texto)}', '${encodeURIComponent(titulo)}')">📄 Exportar respuesta a PDF</button>`;
        }

        // ===== EXPORTAR RESPUESTA A PDF =====
        window.exportarRespuestaPDF = function(textoEncoded, tituloEncoded) {
            const texto = decodeURIComponent(textoEncoded);
            const titulo = decodeURIComponent(tituloEncoded) || 'Respuesta del asistente';
            // Generar HTML con el texto formateado
            const html = `
                <div style="font-family: Arial, sans-serif; padding: 20px; max-width: 100%;">
                    <h2 style="color: #3b473c;">${titulo}</h2>
                    <div style="white-space: pre-wrap; font-size: 12px; line-height: 1.6;">${texto}</div>
                    <p style="margin-top: 20px; font-size: 10px; color: #888; text-align: right;">Generado por Asistente de Turismo - ${new Date().toLocaleDateString('es-CL')}</p>
                </div>
            `;
            const container = document.createElement('div');
            container.style.position = 'absolute';
            container.style.left = '-9999px';
            container.style.top = '0';
            container.style.width = '800px';
            container.style.background = 'white';
            container.style.padding = '20px';
            container.innerHTML = html;
            document.body.appendChild(container);

            setTimeout(() => {
                html2canvas(container, { scale: 2, useCORS: true, logging: false, width: 800 })
                    .then(canvas => {
                        const { jsPDF } = window.jspdf;
                        const pdf = new jsPDF('p', 'mm', 'a4');
                        const imgData = canvas.toDataURL('image/jpeg', 0.95);
                        const imgWidth = 210;
                        const pageHeight = 297;
                        const imgHeight = (canvas.height * imgWidth) / canvas.width;
                        let heightLeft = imgHeight;
                        let position = 0;
                        pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
                        heightLeft -= pageHeight;
                        while (heightLeft > 0) {
                            position = heightLeft - imgHeight;
                            pdf.addPage();
                            pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
                            heightLeft -= pageHeight;
                        }
                        pdf.save(`Asistente_${titulo.replace(/\s+/g, '_')}.pdf`);
                        document.body.removeChild(container);
                    })
                    .catch(err => {
                        console.error(err);
                        alert('Error al generar PDF');
                        document.body.removeChild(container);
                    });
            }, 300);
        };

        // ===== EVENTOS DEL CHAT =====
        document.getElementById('btnEnviar').addEventListener('click', function() {
            const input = document.getElementById('inputMensaje');
            const texto = input.value.trim();
            if (!texto) return;
            input.value = '';
            // Verificar si hay contexto pendiente
            if (window.contextoPregunta) {
                procesarContexto(texto);
            } else {
                procesarPregunta(texto);
            }
        });

        document.getElementById('inputMensaje').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('btnEnviar').click();
            }
        });

        // Botones de preguntas rápidas
        document.querySelectorAll('.btn-pregunta').forEach(btn => {
            btn.addEventListener('click', function() {
                const pregunta = this.dataset.pregunta;
                procesarPregunta(pregunta);
            });
        });

        // ===== INICIALIZAR =====
        cargarDatos();

    })();
</script>

</body>
</html>
