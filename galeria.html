<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería de Viajes</title>
    <link rel="stylesheet" href="css/galeria.css" />
</head>
<body>

<header>
    <h1>📸 Galería de Viajes</h1>
    <div style="display: flex; align-items: center; gap: 12px;">
        <span class="user-badge" id="userBadge">Cargando...</span>
        <a href="index.html" class="volver">← Volver al Lobby</a>
    </div>
</header>

<!-- Contenedor de publicaciones -->
<div id="contenedorPublicaciones" class="galeria-grid">
    <!-- Se llena con JS -->
</div>

<!-- Botón para nueva publicación (solo guías/admin) -->
<div id="botonSubir" style="text-align:center; margin: 20px 0;">
    <button class="btn-subir" id="btnNuevaPublicacion">➕ Nueva publicación</button>
</div>

<!-- MODAL PARA SUBIR PUBLICACIÓN -->
<div id="modalSubir" class="modal">
    <div class="modal-contenido">
        <span class="modal-cerrar" id="modalCerrar">&times;</span>
        <h2>📤 Nueva publicación</h2>
        <form id="formSubir">
            <div class="campo">
                <label>Descripción (máx 500 caracteres)</label>
                <textarea id="inputDescripcion" rows="3" maxlength="500" placeholder="Escribe una descripción para esta publicación..."></textarea>
            </div>
            <div class="campo">
                <label>Calificación con piñas (1 a 5)</label>
                <select id="inputPinas">
                    <option value="1">1 piña</option>
                    <option value="2">2 piñas</option>
                    <option value="3" selected>3 piñas</option>
                    <option value="4">4 piñas</option>
                    <option value="5">5 piñas</option>
                </select>
            </div>
            <div class="campo">
                <label>Imágenes (máximo 4, formato JPG/PNG)</label>
                <input type="file" id="inputImagenes" accept="image/jpeg,image/png" multiple>
                <div id="previsualizacion" class="preview-container"></div>
                <p class="muted">Selecciona hasta 4 imágenes. Serán redimensionadas a 600px de ancho y comprimidas.</p>
            </div>
            <div class="modal-acciones">
                <button type="button" class="btn-cancelar" id="btnCancelarSubir">Cancelar</button>
                <button type="submit" class="btn-guardar" id="btnPublicar">📤 Publicar</button>
            </div>
            <div id="mensajeSubida" style="margin-top: 10px; color: #555;"></div>
        </form>
    </div>
</div>

<script src="js/github.js"></script>
<script src="js/auth.js"></script>
<script>
    (function() {
        // ---- VERIFICAR SESIÓN ----
        const usuario = Auth.getSesion();
        if (!usuario) {
            window.location.href = 'login.html';
            return;
        }
        document.getElementById('userBadge').textContent = `${usuario.nombre} ${usuario.apellido || ''} (${usuario.rol})`;

        const puedeSubir = ['admin', 'guia', 'asistente'].includes(usuario.rol);
        const btnSubir = document.getElementById('btnNuevaPublicacion');
        if (!puedeSubir) {
            btnSubir.style.display = 'none';
        } else {
            btnSubir.addEventListener('click', abrirModal);
        }

        // ---- VARIABLES GLOBALES ----
        let imagenesSeleccionadas = []; // Array de dataURL (ya comprimidas)

        // ---- FUNCIONES PARA SUBIR/BORRAR ARCHIVOS A GITHUB ----
        // Estas funciones usan la API de GitHub y el token de github.js
        async function subirArchivoGitHub(ruta, contenidoBase64, mensaje = 'Subir imagen') {
            const url = `https://api.github.com/repos/${GitHub.owner}/${GitHub.repo}/contents/${ruta}`;
            const body = {
                message: mensaje,
                content: contenidoBase64,
                branch: 'main'
            };
            const resp = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GitHub.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });
            if (!resp.ok) {
                const error = await resp.json();
                throw new Error(`Error al subir ${ruta}: ${error.message || resp.statusText}`);
            }
            return await resp.json();
        }

        async function borrarArchivoGitHub(ruta, sha, mensaje = 'Eliminar imagen') {
            const url = `https://api.github.com/repos/${GitHub.owner}/${GitHub.repo}/contents/${ruta}`;
            const body = {
                message: mensaje,
                sha: sha,
                branch: 'main'
            };
            const resp = await fetch(url, {
                method: 'DELETE',
                headers: {
                    'Authorization': `token ${GitHub.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });
            if (!resp.ok) {
                const error = await resp.json();
                throw new Error(`Error al borrar ${ruta}: ${error.message || resp.statusText}`);
            }
            return await resp.json();
        }

        async function obtenerShaArchivo(ruta) {
            const url = `https://api.github.com/repos/${GitHub.owner}/${GitHub.repo}/contents/${ruta}`;
            const resp = await fetch(url, {
                headers: { 'Authorization': `token ${GitHub.token}` }
            });
            if (!resp.ok) {
                if (resp.status === 404) return null;
                throw new Error(`Error al obtener SHA de ${ruta}`);
            }
            const data = await resp.json();
            return data.sha;
        }

        // ---- CARGAR PUBLICACIONES ----
        async function cargarPublicaciones() {
            const contenedor = document.getElementById('contenedorPublicaciones');
            try {
                const datos = await GitHub.leer('datos/galeria.json');
                if (!datos || !datos.publicaciones || datos.publicaciones.length === 0) {
                    contenedor.innerHTML = `
                        <div class="mensaje-vacio" style="grid-column: 1 / -1;">
                            <p>📭 No hay publicaciones aún.</p>
                            ${puedeSubir ? '<p style="font-size:0.9rem;">¡Sé el primero en compartir una foto!</p>' : ''}
                        </div>
                    `;
                    return;
                }
                const publicaciones = datos.publicaciones.slice().reverse();
                let html = '';
                publicaciones.forEach(pub => {
                    const esAdmin = usuario.rol === 'admin';
                    const esAutor = pub.autor === `${usuario.nombre} ${usuario.apellido || ''}`.trim() || pub.autor === usuario.rut;
                    const puedeEliminar = esAdmin || (['guia', 'asistente'].includes(usuario.rol) && esAutor);

                    let imagenesHtml = '';
                    if (pub.imagenes && pub.imagenes.length > 0) {
                        imagenesHtml = `<div class="pub-imagenes">`;
                        pub.imagenes.forEach(ruta => {
                            // Construir URL raw
                            const url = `https://raw.githubusercontent.com/${GitHub.owner}/${GitHub.repo}/main/${ruta}`;
                            imagenesHtml += `<img src="${url}" alt="Imagen de publicación">`;
                        });
                        imagenesHtml += `</div>`;
                    }

                    let pinasHtml = '';
                    const pinas = pub.pinas || 0;
                    for (let i = 0; i < pinas; i++) {
                        pinasHtml += `<img src="PiñaDePino.png" alt="Piña" class="pina-icono">`;
                    }
                    if (pinas === 0) pinasHtml = '<span class="sin-pinas">Sin calificación</span>';

                    const fecha = new Date(pub.fecha).toLocaleDateString('es-CL', {
                        year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    html += `
                        <div class="publicacion" data-id="${pub.id}">
                            <div class="pub-header">
                                <strong>${pub.autor || 'Anónimo'}</strong>
                                <span class="pub-fecha">${fecha}</span>
                            </div>
                            ${pub.descripcion ? `<div class="pub-desc">${pub.descripcion}</div>` : ''}
                            ${imagenesHtml}
                            <div class="pub-footer">
                                <div class="calificacion">
                                    <span class="pinas-label">Calificación:</span>
                                    ${pinasHtml}
                                </div>
                                ${puedeEliminar ? `<button class="btn-eliminar" data-id="${pub.id}">🗑️ Eliminar</button>` : ''}
                            </div>
                        </div>
                    `;
                });
                contenedor.innerHTML = html;

                document.querySelectorAll('.btn-eliminar').forEach(btn => {
                    btn.addEventListener('click', async function(e) {
                        const id = this.dataset.id;
                        if (confirm('¿Eliminar esta publicación permanentemente?')) {
                            await eliminarPublicacion(id);
                        }
                    });
                });

            } catch (error) {
                console.error('Error al cargar publicaciones:', error);
                contenedor.innerHTML = `<div class="mensaje-vacio" style="grid-column: 1 / -1;"><p>⚠️ Error al cargar la galería.</p></div>`;
            }
        }

        // ---- ELIMINAR PUBLICACIÓN (incluye imágenes) ----
        async function eliminarPublicacion(id) {
            try {
                const datos = await GitHub.leer('datos/galeria.json');
                if (!datos || !datos.publicaciones) return alert('Error al cargar datos');

                const index = datos.publicaciones.findIndex(p => p.id === id);
                if (index === -1) return alert('Publicación no encontrada');

                const pub = datos.publicaciones[index];
                const esAdmin = usuario.rol === 'admin';
                const esAutor = pub.autor === `${usuario.nombre} ${usuario.apellido || ''}`.trim() || pub.autor === usuario.rut;
                const puedeEliminar = esAdmin || (['guia', 'asistente'].includes(usuario.rol) && esAutor);
                if (!puedeEliminar) return alert('No tienes permiso para eliminar esta publicación.');

                // Eliminar las imágenes del repositorio
                if (pub.imagenes && pub.imagenes.length > 0) {
                    for (const ruta of pub.imagenes) {
                        try {
                            const sha = await obtenerShaArchivo(ruta);
                            if (sha) {
                                await borrarArchivoGitHub(ruta, sha);
                            }
                        } catch (err) {
                            console.warn(`No se pudo borrar ${ruta}:`, err);
                            // Continuamos aunque falle una imagen
                        }
                    }
                }

                // Eliminar la publicación del JSON
                datos.publicaciones.splice(index, 1);
                const shaJson = await GitHub.sha('datos/galeria.json');
                const ok = await GitHub.escribir('datos/galeria.json', datos, shaJson);
                if (ok) {
                    alert('✅ Publicación e imágenes eliminadas.');
                    cargarPublicaciones();
                } else {
                    alert('❌ Error al eliminar la publicación del JSON.');
                }
            } catch (error) {
                console.error('Error al eliminar:', error);
                alert('Error al eliminar.');
            }
        }

        // ---- ABRIR MODAL ----
        function abrirModal() {
            document.getElementById('modalSubir').style.display = 'flex';
            document.getElementById('inputDescripcion').value = '';
            document.getElementById('inputImagenes').value = '';
            document.getElementById('previsualizacion').innerHTML = '';
            imagenesSeleccionadas = [];
            document.getElementById('inputPinas').value = '3';
            document.getElementById('mensajeSubida').textContent = '';
            document.getElementById('btnPublicar').disabled = false;
        }

        function cerrarModal() {
            document.getElementById('modalSubir').style.display = 'none';
        }

        // ---- PREVISUALIZACIÓN Y COMPRESIÓN ----
        document.getElementById('inputImagenes').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length > 4) {
                alert('Máximo 4 imágenes.');
                this.value = '';
                return;
            }
            const preview = document.getElementById('previsualizacion');
            preview.innerHTML = '';
            imagenesSeleccionadas = [];
            let procesadas = 0;

            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;
                        const maxWidth = 600; // Reducido para comprimir más
                        if (width > maxWidth) {
                            height = (maxWidth / width) * height;
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        // Calidad 0.6 para reducir tamaño
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                        imagenesSeleccionadas.push(dataUrl);

                        const div = document.createElement('div');
                        div.className = 'preview-thumb';
                        const thumb = document.createElement('img');
                        thumb.src = dataUrl;
                        div.appendChild(thumb);
                        const btnEliminar = document.createElement('button');
                        btnEliminar.textContent = '✕';
                        btnEliminar.className = 'eliminar-thumb';
                        btnEliminar.dataset.index = index;
                        btnEliminar.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const idx = parseInt(this.dataset.index);
                            imagenesSeleccionadas.splice(idx, 1);
                            const parent = this.closest('.preview-thumb');
                            parent.remove();
                            document.querySelectorAll('.eliminar-thumb').forEach((btn, i) => {
                                btn.dataset.index = i;
                            });
                        });
                        div.appendChild(btnEliminar);
                        preview.appendChild(div);
                        procesadas++;
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
        });

        // ---- SUBIR PUBLICACIÓN (con imágenes como archivos) ----
        document.getElementById('formSubir').addEventListener('submit', async function(e) {
            e.preventDefault();
            const descripcion = document.getElementById('inputDescripcion').value.trim();
            const pinas = parseInt(document.getElementById('inputPinas').value);
            if (imagenesSeleccionadas.length === 0) {
                alert('Debes seleccionar al menos una imagen.');
                return;
            }
            if (imagenesSeleccionadas.length > 4) {
                alert('Máximo 4 imágenes.');
                return;
            }

            const btnPublicar = document.getElementById('btnPublicar');
            const mensajeDiv = document.getElementById('mensajeSubida');
            btnPublicar.disabled = true;
            btnPublicar.textContent = '⏳ Subiendo...';
            mensajeDiv.textContent = 'Subiendo imágenes...';

            const id = `pub_${Date.now()}`;
            const rutasImagenes = [];

            try {
                // 1. Subir cada imagen como archivo
                for (let i = 0; i < imagenesSeleccionadas.length; i++) {
                    const dataUrl = imagenesSeleccionadas[i];
                    // Extraer solo el contenido base64 (sin el prefijo)
                    const base64Data = dataUrl.split(',')[1];
                    const nombre = `imagenes/${id}_${i}.jpg`;
                    await subirArchivoGitHub(nombre, base64Data, `Subir imagen para publicación ${id}`);
                    rutasImagenes.push(nombre);
                    mensajeDiv.textContent = `Subiendo imagen ${i+1}/${imagenesSeleccionadas.length}...`;
                }

                // 2. Crear la publicación en el JSON
                const publicacion = {
                    id: id,
                    autor: `${usuario.nombre} ${usuario.apellido || ''}`.trim() || usuario.rut,
                    fecha: new Date().toISOString(),
                    descripcion: descripcion || 'Sin descripción',
                    imagenes: rutasImagenes,
                    pinas: pinas
                };

                let datos = await GitHub.leer('datos/galeria.json');
                if (!datos) datos = { publicaciones: [] };
                if (!datos.publicaciones) datos.publicaciones = [];
                datos.publicaciones.push(publicacion);

                const sha = await GitHub.sha('datos/galeria.json');
                const ok = await GitHub.escribir('datos/galeria.json', datos, sha);
                if (ok) {
                    alert('✅ Publicación subida exitosamente.');
                    cerrarModal();
                    cargarPublicaciones();
                } else {
                    // Si falla guardar el JSON, intentar borrar las imágenes subidas
                    for (const ruta of rutasImagenes) {
                        try {
                            const shaImg = await obtenerShaArchivo(ruta);
                            if (shaImg) await borrarArchivoGitHub(ruta, shaImg);
                        } catch (e) {}
                    }
                    alert('❌ Error al guardar la publicación en el JSON. Las imágenes han sido eliminadas.');
                }
            } catch (error) {
                console.error('Error al subir:', error);
                alert(`❌ Error: ${error.message}`);
                // Intentar limpiar imágenes subidas parcialmente
                for (const ruta of rutasImagenes) {
                    try {
                        const shaImg = await obtenerShaArchivo(ruta);
                        if (shaImg) await borrarArchivoGitHub(ruta, shaImg);
                    } catch (e) {}
                }
            } finally {
                btnPublicar.disabled = false;
                btnPublicar.textContent = '📤 Publicar';
                mensajeDiv.textContent = '';
            }
        });

        // ---- EVENTOS DE MODAL ----
        document.getElementById('modalCerrar').addEventListener('click', cerrarModal);
        document.getElementById('btnCancelarSubir').addEventListener('click', cerrarModal);
        window.addEventListener('click', function(e) {
            if (e.target === document.getElementById('modalSubir')) {
                cerrarModal();
            }
        });

        // ---- INICIALIZAR ----
        cargarPublicaciones();
        window.recargarGaleria = cargarPublicaciones;
    })();
</script>
</body>
</html>
