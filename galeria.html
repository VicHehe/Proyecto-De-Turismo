<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería de Viajes</title>
    <link rel="stylesheet" href="css/galeria.css" />
</head>
<body>

<header>
    <h1>📸 Galería de Viajes</h1>
    <div style="display: flex; align-items: center; gap: 12px;">
        <span class="user-badge" id="userBadge">Cargando...</span>
        <a href="index.html" class="volver">← Volver al Lobby</a>
    </div>
</header>

<!-- Contenedor de publicaciones -->
<div id="contenedorPublicaciones" class="galeria-grid"></div>

<!-- Controles de paginación -->
<div id="paginacion">
    <button id="btnAnterior" class="btn-pagina">⬅ Anterior</button>
    <span id="infoPagina">Página 1 de 1</span>
    <button id="btnSiguiente" class="btn-pagina">Siguiente ➡</button>
</div>

<!-- Botón para nueva publicación -->
<div id="botonSubir" style="text-align:center; margin: 20px 0;">
    <button class="btn-subir" id="btnNuevaPublicacion">➕ Nueva publicación</button>
</div>

<!-- MODAL PARA SUBIR -->
<div id="modalSubir" class="modal">
    <div class="modal-contenido">
        <span class="modal-cerrar" id="modalCerrar">&times;</span>
        <h2>📤 Nueva publicación</h2>
        <form id="formSubir">
            <div class="campo">
                <label>Descripción (máx 500 caracteres)</label>
                <textarea id="inputDescripcion" rows="3" maxlength="500" placeholder="Escribe una descripción..."></textarea>
            </div>
            <div class="campo">
                <label>Calificación con piñas (1 a 5)</label>
                <select id="inputPinas">
                    <option value="1">1 piña</option>
                    <option value="2">2 piñas</option>
                    <option value="3" selected>3 piñas</option>
                    <option value="4">4 piñas</option>
                    <option value="5">5 piñas</option>
                </select>
            </div>
            <div class="campo">
                <label>Imágenes (máximo 4, formato JPG/PNG)</label>
                <input type="file" id="inputImagenes" accept="image/jpeg,image/png" multiple>
                <div id="previsualizacion" class="preview-container"></div>
                <p class="muted">Selecciona hasta 4 imágenes. Serán redimensionadas a 350px de ancho y comprimidas (calidad 0.5).</p>
            </div>
            <div class="modal-acciones">
                <button type="button" class="btn-cancelar" id="btnCancelarSubir">Cancelar</button>
                <button type="submit" class="btn-guardar" id="btnPublicar">📤 Publicar</button>
            </div>
            <div id="mensajeSubida" style="margin-top: 10px; color: #555;"></div>
        </form>
    </div>
</div>

<script src="js/github.js"></script>
<script src="js/auth.js"></script>
<script>
    (function() {
        // ============================================================
        // CONFIGURACIÓN Y SESIÓN
        // ============================================================
        const usuario = Auth.getSesion();
        if (!usuario) {
            window.location.href = 'login.html';
            return;
        }
        document.getElementById('userBadge').textContent = `${usuario.nombre} ${usuario.apellido || ''} (${usuario.rol})`;

        const puedeSubir = ['admin', 'guia', 'asistente'].includes(usuario.rol);
        const btnSubir = document.getElementById('btnNuevaPublicacion');
        if (!puedeSubir) {
            btnSubir.style.display = 'none';
        } else {
            btnSubir.addEventListener('click', abrirModal);
        }

        // ============================================================
        // FUNCIONES PARA TRABAJAR CON EL WORKER
        // ============================================================
        const WORKER_URL = 'https://green-flower-8734.victortilleria116.workers.dev';

        async function subirArchivoGitHub(ruta, contenidoBase64, mensaje = 'Subir archivo') {
            const body = { message: mensaje, content: contenidoBase64 };
            const res = await fetch(`${WORKER_URL}?path=${encodeURIComponent(ruta)}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                const errorText = await res.text();
                throw new Error(`Error al subir ${ruta}: ${errorText}`);
            }
            return await res.json();
        }

        async function borrarArchivoGitHub(ruta, sha, mensaje = 'Eliminar archivo') {
            const body = { sha, message: mensaje };
            const res = await fetch(`${WORKER_URL}?path=${encodeURIComponent(ruta)}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                const errorText = await res.text();
                throw new Error(`Error al borrar ${ruta}: ${errorText}`);
            }
            return await res.json();
        }

        async function obtenerShaArchivo(ruta) {
            return await GitHub.sha(ruta);
        }

        // ============================================================
        // OBTENER IMAGEN EN BASE64 DESDE EL WORKER
        // ============================================================
        async function obtenerImagenBase64(ruta) {
            try {
                const res = await fetch(`${WORKER_URL}?path=${encodeURIComponent(ruta)}`);
                if (!res.ok) {
                    console.warn(`Error al obtener imagen ${ruta}: ${res.status}`);
                    return null;
                }
                const data = await res.json();
                return data.content || null;
            } catch (e) {
                console.error('Error en obtenerImagenBase64:', ruta, e);
                return null;
            }
        }

        // ============================================================
        // ASEGURAR CARPETAS Y ARCHIVOS INICIALES
        // ============================================================
        async function asegurarCarpetaImagenes() {
            try {
                const sha = await GitHub.sha('imagenes/.gitkeep');
                if (!sha) {
                    await subirArchivoGitHub('imagenes/.gitkeep', btoa('# Carpeta para imágenes'), 'Crear carpeta imagenes');
                    console.log('✅ Carpeta imagenes creada.');
                }
            } catch (e) { console.warn('No se pudo crear carpeta imagenes:', e); }
        }

        async function asegurarCarpetaPublicaciones() {
            try {
                const sha = await GitHub.sha('publicaciones/.gitkeep');
                if (!sha) {
                    await subirArchivoGitHub('publicaciones/.gitkeep', btoa('# Carpeta para publicaciones'), 'Crear carpeta publicaciones');
                    console.log('✅ Carpeta publicaciones creada.');
                }
            } catch (e) { console.warn('No se pudo crear carpeta publicaciones:', e); }
        }

        async function asegurarIndice() {
            try {
                const datos = await GitHub.leer('publicaciones/indice.json');
                if (!datos) {
                    await GitHub.escribir('publicaciones/indice.json', { publicaciones: [] });
                    console.log('✅ indice.json creado.');
                }
            } catch (e) { console.warn('Error al asegurar indice:', e); }
        }

        // ============================================================
        // VARIABLES DE PAGINACIÓN
        // ============================================================
        let publicacionesCompletas = [];
        let paginaActual = 0;
        const POR_PAGINA = 4;

        // ============================================================
        // CARGAR PUBLICACIONES (con paginación)
        // ============================================================
        async function cargarPublicaciones() {
            const contenedor = document.getElementById('contenedorPublicaciones');
            try {
                const indice = await GitHub.leer('publicaciones/indice.json');
                if (!indice || !indice.publicaciones || indice.publicaciones.length === 0) {
                    contenedor.innerHTML = `
                        <div class="mensaje-vacio" style="grid-column: 1 / -1;">
                            <p>📭 No hay publicaciones aún.</p>
                            ${puedeSubir ? '<p style="font-size:0.9rem;">¡Sé el primero en compartir una foto!</p>' : ''}
                        </div>
                    `;
                    document.getElementById('paginacion').style.display = 'none';
                    return;
                }
                document.getElementById('paginacion').style.display = 'flex';
                publicacionesCompletas = indice.publicaciones.slice().reverse();
                const totalPaginas = Math.ceil(publicacionesCompletas.length / POR_PAGINA);
                if (paginaActual >= totalPaginas) paginaActual = totalPaginas - 1;
                if (paginaActual < 0) paginaActual = 0;
                await renderizarPagina(paginaActual, totalPaginas);
            } catch (error) {
                console.error('Error al cargar publicaciones:', error);
                contenedor.innerHTML = `<div class="mensaje-vacio" style="grid-column: 1 / -1;"><p>⚠️ Error al cargar la galería.</p></div>`;
                document.getElementById('paginacion').style.display = 'none';
            }
        }

        // ============================================================
        // RENDERIZAR PÁGINA (con carga de imágenes desde Worker)
        // ============================================================
        async function renderizarPagina(pagina, totalPaginas) {
            const contenedor = document.getElementById('contenedorPublicaciones');
            const inicio = pagina * POR_PAGINA;
            const fin = Math.min(inicio + POR_PAGINA, publicacionesCompletas.length);
            const publicacionesPagina = publicacionesCompletas.slice(inicio, fin);
            
            let html = '';
            for (const pub of publicacionesPagina) {
                const esAdmin = usuario.rol === 'admin';
                const esAutor = pub.autor === `${usuario.nombre} ${usuario.apellido || ''}`.trim() || pub.autor === usuario.rut;
                const puedeEliminar = esAdmin || (['guia', 'asistente'].includes(usuario.rol) && esAutor);

                let imagenesHtml = '';
                if (pub.imagenes && pub.imagenes.length > 0) {
                    const imagenesDataUrls = [];
                    for (const ruta of pub.imagenes) {
                        const base64 = await obtenerImagenBase64(ruta);
                        if (base64) {
                            imagenesDataUrls.push(`data:image/jpeg;base64,${base64}`);
                        } else {
                            imagenesDataUrls.push(null);
                        }
                    }
                    imagenesHtml = `<div class="pub-imagenes">`;
                    for (const dataUrl of imagenesDataUrls) {
                        if (dataUrl) {
                            imagenesHtml += `<img src="${dataUrl}" alt="Imagen" loading="lazy">`;
                        } else {
                            imagenesHtml += `<div class="img-placeholder">🖼️ Imagen no disponible</div>`;
                        }
                    }
                    imagenesHtml += `</div>`;
                }

                let pinasHtml = '';
                const pinas = pub.pinas || 0;
                for (let i = 0; i < pinas; i++) {
                    pinasHtml += `<img src="PiñaDePino.png" alt="Piña" class="pina-icono">`;
                }
                if (pinas === 0) pinasHtml = '<span class="sin-pinas">Sin calificación</span>';

                const fecha = new Date(pub.fecha).toLocaleDateString('es-CL', {
                    year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                html += `
                    <div class="publicacion" data-id="${pub.id}">
                        <div class="pub-header">
                            <strong>${pub.autor || 'Anónimo'}</strong>
                            <span class="pub-fecha">${fecha}</span>
                        </div>
                        ${pub.descripcion ? `<div class="pub-desc">${pub.descripcion}</div>` : ''}
                        ${imagenesHtml}
                        <div class="pub-footer">
                            <div class="calificacion">
                                <span class="pinas-label">Calificación:</span>
                                ${pinasHtml}
                            </div>
                            ${puedeEliminar ? `<button class="btn-eliminar" data-id="${pub.id}">🗑️ Eliminar</button>` : ''}
                        </div>
                    </div>
                `;
            }

            contenedor.innerHTML = html || `<div class="mensaje-vacio" style="grid-column: 1 / -1;"><p>No hay publicaciones en esta página.</p></div>`;

            document.getElementById('infoPagina').textContent = `Página ${pagina+1} de ${totalPaginas}`;
            document.getElementById('btnAnterior').disabled = (pagina === 0);
            document.getElementById('btnSiguiente').disabled = (pagina === totalPaginas - 1);

            document.querySelectorAll('.btn-eliminar').forEach(btn => {
                btn.addEventListener('click', async function(e) {
                    const id = this.dataset.id;
                    if (confirm('¿Eliminar esta publicación permanentemente?')) {
                        await eliminarPublicacion(id);
                    }
                });
            });

            paginaActual = pagina;
        }

        // ============================================================
        // ELIMINAR PUBLICACIÓN
        // ============================================================
        async function eliminarPublicacion(id) {
            try {
                const pubData = await GitHub.leer(`publicaciones/${id}.json`);
                if (!pubData) {
                    await eliminarDelIndice(id);
                    alert('Publicación eliminada del índice (archivo individual no encontrado).');
                    cargarPublicaciones();
                    return;
                }

                if (pubData.imagenes && pubData.imagenes.length > 0) {
                    for (const ruta of pubData.imagenes) {
                        try {
                            const sha = await obtenerShaArchivo(ruta);
                            if (sha) await borrarArchivoGitHub(ruta, sha);
                        } catch (err) {
                            console.warn(`No se pudo borrar ${ruta}:`, err);
                        }
                    }
                }

                const shaPub = await obtenerShaArchivo(`publicaciones/${id}.json`);
                if (shaPub) await borrarArchivoGitHub(`publicaciones/${id}.json`, shaPub);

                await eliminarDelIndice(id);

                alert('✅ Publicación eliminada completamente.');
                cargarPublicaciones();

            } catch (error) {
                console.error('Error al eliminar:', error);
                alert('Error al eliminar la publicación.');
            }
        }

        async function eliminarDelIndice(id) {
            const indice = await GitHub.leer('publicaciones/indice.json');
            if (!indice || !indice.publicaciones) return;
            const index = indice.publicaciones.findIndex(p => p.id === id);
            if (index !== -1) {
                indice.publicaciones.splice(index, 1);
                const shaIndice = await GitHub.sha('publicaciones/indice.json');
                await GitHub.escribir('publicaciones/indice.json', indice, shaIndice);
            }
        }

        // ============================================================
        // EVENTOS DE NAVEGACIÓN
        // ============================================================
        document.getElementById('btnAnterior').addEventListener('click', () => {
            if (paginaActual > 0) {
                paginaActual--;
                cargarPublicaciones();
            }
        });
        document.getElementById('btnSiguiente').addEventListener('click', () => {
            const totalPaginas = Math.ceil(publicacionesCompletas.length / POR_PAGINA);
            if (paginaActual < totalPaginas - 1) {
                paginaActual++;
                cargarPublicaciones();
            }
        });

        // ============================================================
        // ABRIR/CERRAR MODAL
        // ============================================================
        let imagenesSeleccionadas = [];

        function abrirModal() {
            document.getElementById('modalSubir').style.display = 'flex';
            document.getElementById('inputDescripcion').value = '';
            document.getElementById('inputImagenes').value = '';
            document.getElementById('previsualizacion').innerHTML = '';
            imagenesSeleccionadas = [];
            document.getElementById('inputPinas').value = '3';
            document.getElementById('mensajeSubida').textContent = '';
            document.getElementById('btnPublicar').disabled = false;
        }

        function cerrarModal() {
            document.getElementById('modalSubir').style.display = 'none';
        }

        // ============================================================
        // PREVISUALIZACIÓN Y COMPRESIÓN (350px, calidad 0.5)
        // ============================================================
        document.getElementById('inputImagenes').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length > 4) {
                alert('Máximo 4 imágenes.');
                this.value = '';
                return;
            }
            const preview = document.getElementById('previsualizacion');
            preview.innerHTML = '';
            imagenesSeleccionadas = [];

            Array.from(files).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;
                        const maxWidth = 350; // NUEVO TAMAÑO
                        if (width > maxWidth) {
                            height = (maxWidth / width) * height;
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.5); // Calidad 0.5
                        imagenesSeleccionadas.push(dataUrl);

                        const div = document.createElement('div');
                        div.className = 'preview-thumb';
                        const thumb = document.createElement('img');
                        thumb.src = dataUrl;
                        div.appendChild(thumb);
                        const btnEliminar = document.createElement('button');
                        btnEliminar.textContent = '✕';
                        btnEliminar.className = 'eliminar-thumb';
                        btnEliminar.dataset.index = index;
                        btnEliminar.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const idx = parseInt(this.dataset.index);
                            imagenesSeleccionadas.splice(idx, 1);
                            const parent = this.closest('.preview-thumb');
                            parent.remove();
                            document.querySelectorAll('.eliminar-thumb').forEach((btn, i) => {
                                btn.dataset.index = i;
                            });
                        });
                        div.appendChild(btnEliminar);
                        preview.appendChild(div);
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
        });

        // ============================================================
        // SUBIR NUEVA PUBLICACIÓN
        // ============================================================
        document.getElementById('formSubir').addEventListener('submit', async function(e) {
            e.preventDefault();
            const descripcion = document.getElementById('inputDescripcion').value.trim();
            const pinas = parseInt(document.getElementById('inputPinas').value);
            if (imagenesSeleccionadas.length === 0) {
                alert('Debes seleccionar al menos una imagen.');
                return;
            }
            if (imagenesSeleccionadas.length > 4) {
                alert('Máximo 4 imágenes.');
                return;
            }

            const btnPublicar = document.getElementById('btnPublicar');
            const mensajeDiv = document.getElementById('mensajeSubida');
            btnPublicar.disabled = true;
            btnPublicar.textContent = '⏳ Subiendo...';
            mensajeDiv.textContent = 'Subiendo imágenes...';

            const id = `pub_${Date.now()}`;
            const rutasImagenes = [];

            try {
                for (let i = 0; i < imagenesSeleccionadas.length; i++) {
                    const dataUrl = imagenesSeleccionadas[i];
                    const base64Data = dataUrl.split(',')[1];
                    const nombre = `imagenes/${id}_${i}.jpg`;
                    await subirArchivoGitHub(nombre, base64Data, `Subir imagen para ${id}`);
                    rutasImagenes.push(nombre);
                    mensajeDiv.textContent = `Subiendo imagen ${i+1}/${imagenesSeleccionadas.length}...`;
                }

                const publicacion = {
                    id: id,
                    autor: `${usuario.nombre} ${usuario.apellido || ''}`.trim() || usuario.rut,
                    fecha: new Date().toISOString(),
                    descripcion: descripcion || 'Sin descripción',
                    imagenes: rutasImagenes,
                    pinas: pinas
                };

                await GitHub.escribir(`publicaciones/${id}.json`, publicacion);

                const indice = await GitHub.leer('publicaciones/indice.json');
                if (!indice) {
                    await GitHub.escribir('publicaciones/indice.json', { publicaciones: [publicacion] });
                } else {
                    if (!indice.publicaciones) indice.publicaciones = [];
                    indice.publicaciones.push(publicacion);
                    const shaIndice = await GitHub.sha('publicaciones/indice.json');
                    await GitHub.escribir('publicaciones/indice.json', indice, shaIndice);
                }

                alert('✅ Publicación subida exitosamente.');
                cerrarModal();
                cargarPublicaciones();

            } catch (error) {
                console.error('Error al subir:', error);
                alert(`❌ Error: ${error.message}`);
                for (const ruta of rutasImagenes) {
                    try {
                        const shaImg = await obtenerShaArchivo(ruta);
                        if (shaImg) await borrarArchivoGitHub(ruta, shaImg);
                    } catch (e) {}
                }
                try {
                    const shaPub = await obtenerShaArchivo(`publicaciones/${id}.json`);
                    if (shaPub) await borrarArchivoGitHub(`publicaciones/${id}.json`, shaPub);
                } catch (e) {}
            } finally {
                btnPublicar.disabled = false;
                btnPublicar.textContent = '📤 Publicar';
                mensajeDiv.textContent = '';
            }
        });

        // ============================================================
        // EVENTOS DEL MODAL
        // ============================================================
        document.getElementById('modalCerrar').addEventListener('click', cerrarModal);
        document.getElementById('btnCancelarSubir').addEventListener('click', cerrarModal);
        window.addEventListener('click', function(e) {
            if (e.target === document.getElementById('modalSubir')) {
                cerrarModal();
            }
        });

        // ============================================================
        // INICIALIZACIÓN
        // ============================================================
        (async function init() {
            await asegurarCarpetaImagenes();
            await asegurarCarpetaPublicaciones();
            await asegurarIndice();
            await cargarPublicaciones();
            window.recargarGaleria = cargarPublicaciones;
        })();

    })();
</script>
</body>
</html>
