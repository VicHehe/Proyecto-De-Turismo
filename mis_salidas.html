<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Salidas</title>
    <link rel="stylesheet" href="css/mis_salidas.css">
</head>
<body>

<header>
    <h1>📋 Mis Salidas</h1>
    <div style="display: flex; align-items: center; gap: 12px;">
        <span class="user-badge" id="userBadge">Cargando...</span>
        <a href="index.html" class="volver">← Volver al Lobby</a>
    </div>
</header>

<div class="contenedor-principal">
    <!-- Panel izquierdo: listado de salidas -->
    <aside class="panel-lista">
        <h2>Mis salidas</h2>
        <div id="listaSalidas">
            <p class="cargando">Cargando salidas...</p>
        </div>
    </aside>

    <!-- Panel derecho: detalle y edición -->
    <main class="panel-detalle">
        <div id="detalleSalida">
            <div class="mensaje-inicial">
                <p>👈 Selecciona una salida de la lista para ver sus detalles.</p>
            </div>
        </div>
    </main>
</div>

<!-- MODAL DE EDICIÓN -->
<div id="modalEditar" class="modal">
    <div class="modal-contenido">
        <span class="modal-cerrar" id="modalCerrar">&times;</span>
        <h2>✏️ Editar Salida</h2>
        <form id="formEditarSalida">
            <input type="hidden" id="editId" />

            <div class="campo">
                <label>Título *</label>
                <input type="text" id="editTitulo" required>
            </div>
            <div class="campo">
                <label>Fecha *</label>
                <input type="date" id="editFecha" required>
            </div>
            <div class="campo">
                <label>Duración</label>
                <select id="editDuracion">
                    <option value="1 dia">1 día</option>
                    <option value="2 dias">2 días</option>
                    <option value="3 dias">3 días</option>
                    <option value="Mas de 3 dias">Más de 3 días</option>
                </select>
            </div>
            <div class="campo">
                <label>Descripción</label>
                <textarea id="editDescripcion" rows="2"></textarea>
            </div>

            <h3>📍 Ruta (actividades)</h3>
            <div id="editRutaContainer">
                <!-- Se llena dinámicamente -->
            </div>
            <button type="button" class="btn-agregar-actividad" id="btnAgregarActividad">➕ Agregar actividad</button>

            <h3>👥 Participantes</h3>
            <div id="editParticipantesContainer">
                <!-- Se llena dinámicamente -->
            </div>
            <div class="campo" style="display:flex; gap:0.5rem; align-items:center;">
                <input type="text" id="editNuevoParticipante" placeholder="RUT del participante">
                <select id="editRolParticipante">
                    <option value="Visitante">Visitante</option>
                    <option value="Asistente">Asistente</option>
                    <option value="Guía">Guía</option>
                </select>
                <button type="button" class="btn-small" id="btnAgregarParticipante">➕ Añadir</button>
            </div>

            <h3>🚌 Transporte</h3>
            <div class="campo">
                <label>Conductor</label>
                <input type="text" id="editConductor">
            </div>
            <div class="campo">
                <label>Horarios (ida/vuelta)</label>
                <input type="text" id="editHorarios" placeholder="Ej: 08:00 – 18:00">
            </div>
            <div class="campo">
                <label>Precio del servicio</label>
                <input type="text" id="editPrecioTransporte" placeholder="Ej: $ 85.000 CLP">
            </div>
            <div class="campo">
                <label>Descripción del vehículo</label>
                <input type="text" id="editDescTransporte" placeholder="Ej: Bus 30 asientos, climatizado">
            </div>

            <h3>📋 Datos complementarios</h3>
            <div class="campo">
                <label>Curso</label>
                <input type="text" id="editCurso" placeholder="Ej: 4° Medio A">
            </div>
            <div class="campo">
                <label>Precio por persona (CLP)</label>
                <input type="text" id="editPrecio" placeholder="Ej: 12500">
            </div>
            <div class="campo">
                <label>Menú / Catering</label>
                <input type="text" id="editMenu" placeholder="Ej: Box lunch">
            </div>

            <div class="modal-acciones">
                <button type="button" class="btn-cancelar" id="btnCancelarEdicion">Cancelar</button>
                <button type="submit" class="btn-guardar">💾 Guardar cambios</button>
            </div>
        </form>
    </div>
</div>

<script src="js/github.js"></script>
<script src="js/auth.js"></script>
<script src="js/planificacion.js"></script>
<script src="js/lugares.js"></script>
<script>
    // ============================================================
    // mis_salidas.js - Versión completa con soporte para URL ?id=xxx
    // y botón de eliminar salida (estilo CSS)
    // ============================================================

    (function() {
        const usuario = Auth.getSesion();
        if (!usuario) {
            window.location.href = 'login.html';
            return;
        }
        if (!['admin', 'guia', 'asistente'].includes(usuario.rol)) {
            alert('No tienes permiso para ver esta página.');
            window.location.href = 'index.html';
            return;
        }

        document.getElementById('userBadge').textContent = `${usuario.nombre} ${usuario.apellido || ''} (${usuario.rol})`;

        // ===== LEER ID DESDE LA URL =====
        const urlParams = new URLSearchParams(window.location.search);
        const idDesdeURL = urlParams.get('id');

        let todasLasSalidas = [];
        let salidaSeleccionada = null;
        let editando = false;

        function getSalidasDelUsuario(todas) {
            if (usuario.rol === 'admin') return todas;
            return todas.filter(s => {
                const esGuia = s.guias.some(g => g.rut === usuario.rut);
                const esParticipante = s.participantes.some(p => p.rut === usuario.rut);
                return esGuia || esParticipante;
            });
        }

        async function cargarDatos() {
            try {
                todasLasSalidas = await Planificacion.cargarSalidas();
                const misSalidas = getSalidasDelUsuario(todasLasSalidas);
                misSalidas.sort((a, b) => (a.fecha > b.fecha) ? -1 : 1);
                renderizarLista(misSalidas);

                if (idDesdeURL) {
                    const salida = misSalidas.find(s => s.id === idDesdeURL);
                    if (salida) {
                        seleccionarSalida(idDesdeURL);
                    } else if (misSalidas.length > 0) {
                        seleccionarSalida(misSalidas[0].id);
                    } else {
                        mostrarSinSalidas();
                    }
                } else {
                    if (misSalidas.length > 0) {
                        seleccionarSalida(misSalidas[0].id);
                    } else {
                        mostrarSinSalidas();
                    }
                }
            } catch (error) {
                console.error('Error al cargar salidas:', error);
                document.getElementById('listaSalidas').innerHTML = `<p class="error">Error al cargar salidas.</p>`;
            }
        }

        function mostrarSinSalidas() {
            document.getElementById('detalleSalida').innerHTML = `
                <div class="mensaje-inicial">
                    <p>📭 No tienes salidas asignadas.</p>
                </div>
            `;
        }

        function renderizarLista(salidas) {
            const contenedor = document.getElementById('listaSalidas');
            if (!salidas || salidas.length === 0) {
                contenedor.innerHTML = `<p class="vacio">No hay salidas.</p>`;
                return;
            }
            let html = '';
            salidas.forEach(s => {
                const activa = (salidaSeleccionada && salidaSeleccionada.id === s.id) ? 'activa' : '';
                html += `
                    <div class="item-salida ${activa}" data-id="${s.id}">
                        <strong>${s.titulo || 'Sin título'}</strong>
                        <span>📅 ${s.fecha || 'Sin fecha'}</span>
                    </div>
                `;
            });
            contenedor.innerHTML = html;

            contenedor.querySelectorAll('.item-salida').forEach(el => {
                el.addEventListener('click', function() {
                    seleccionarSalida(this.dataset.id);
                });
            });
        }

        // ===== SELECCIONAR SALIDA (async) =====
        window.seleccionarSalida = async function(id) {
            const salida = todasLasSalidas.find(s => s.id === id);
            if (!salida) return;
            salidaSeleccionada = salida;
            document.querySelectorAll('.item-salida').forEach(el => {
                el.classList.toggle('activa', el.dataset.id === id);
            });
            await renderizarDetalle(salida);
        };

        // ===== ELIMINAR SALIDA =====
        async function eliminarSalida(id) {
            const salida = todasLasSalidas.find(s => s.id === id);
            if (!salida) return alert('Salida no encontrada.');
            if (!confirm(`¿Estás seguro de eliminar la salida "${salida.titulo || 'Sin título'}"? Esta acción es permanente.`)) {
                return;
            }

            const ok = await Planificacion.eliminarSalida(id);
            if (ok) {
                alert('✅ Salida eliminada correctamente.');
                // Recargar datos
                await cargarDatos();
                // Si la lista no está vacía, seleccionar la primera
                const misSalidas = getSalidasDelUsuario(todasLasSalidas);
                if (misSalidas.length > 0) {
                    seleccionarSalida(misSalidas[0].id);
                } else {
                    mostrarSinSalidas();
                }
            } else {
                alert('❌ Error al eliminar la salida.');
            }
        }
        window.eliminarSalida = eliminarSalida;

        // ===== RENDERIZAR DETALLE (async) =====
        async function renderizarDetalle(salida) {
            const contenedor = document.getElementById('detalleSalida');
            const datosUsuarios = await GitHub.leer('datos/usuarios.json');
            const usuarios = datosUsuarios ? datosUsuarios.usuarios : [];

            const participantesConInfo = salida.participantes.map(p => {
                const user = usuarios.find(u => u.rut === p.rut);
                return {
                    ...p,
                    edad: user ? user.edad : '—',
                    telefono: user ? user.telefono : '—',
                    historial: user ? user.historial : 'Sin información'
                };
            });

            const lugaresInfo = typeof lugares !== 'undefined' ? lugares : [];
            const rutaEnriquecida = salida.ruta ? salida.ruta.map(act => {
                if (act.tipo === 'Lugar') {
                    const lugar = lugaresInfo.find(l => l.nombre.toLowerCase() === act.descripcion.toLowerCase());
                    if (lugar) return { ...act, lugarInfo: lugar };
                }
                return act;
            }) : [];

            const esAdmin = usuario.rol === 'admin';
            const esGuia = usuario.rol === 'guia' || usuario.rol === 'asistente';
            const puedeEditar = esAdmin || esGuia;

            let html = `
                <div class="detalle-header">
                    <h2>${salida.titulo || 'Sin título'}</h2>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        ${puedeEditar ? `
                            <button class="btn-editar" id="btnAbrirEditar">✏️ Editar</button>
                            <button class="btn-eliminar" id="btnEliminar">🗑️ Eliminar</button>
                        ` : ''}
                    </div>
                </div>
                <div class="detalle-body">
                    <p><strong>Fecha:</strong> ${salida.fecha || 'No definida'}</p>
                    <p><strong>Duración:</strong> ${salida.duracion || 'No especificada'}</p>
                    <p><strong>Descripción:</strong> ${salida.descripcion || 'Sin descripción'}</p>

                    <h3>📍 Ruta</h3>
                    ${rutaEnriquecida.length > 0 ? `
                        <ul class="ruta-lista">
                            ${rutaEnriquecida.map(act => `
                                <li>
                                    <strong>${act.tipo}:</strong> ${act.descripcion}
                                    <span class="horario">(${act.inicio} - ${act.fin})</span>
                                    ${act.lugarInfo ? `
                                        <div class="lugar-info">
                                            <div><strong>Ubicación:</strong> ${act.lugarInfo.ubicacion || 'No disponible'}</div>
                                            <div><strong>Horario:</strong> ${act.lugarInfo.apertura || 'N/A'} - ${act.lugarInfo.cierre || 'N/A'}</div>
                                            <div><strong>Descripción:</strong> ${act.lugarInfo.descripcion || ''}</div>
                                        </div>
                                    ` : ''}
                                </li>
                            `).join('')}
                        </ul>
                    ` : '<p>Sin ruta definida.</p>'}

                    <h3>👥 Participantes (${participantesConInfo.length})</h3>
                    ${participantesConInfo.length > 0 ? `
                        <table class="participantes-tabla">
                            <thead><tr><th>Nombre</th><th>RUT</th><th>Rol</th><th>Edad</th><th>Teléfono</th><th>Historial Médico</th></tr></thead>
                            <tbody>
                                ${participantesConInfo.map(p => `
                                    <tr>
                                        <td>${p.nombre}</td>
                                        <td>${p.rut}</td>
                                        <td>${p.rol}</td>
                                        <td>${p.edad}</td>
                                        <td>${p.telefono}</td>
                                        <td>${p.historial}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    ` : '<p>No hay participantes.</p>'}

                    <h3>🚌 Transporte</h3>
                    ${salida.transporte ? `
                        <p><strong>Conductor:</strong> ${salida.transporte.conductor || 'No especificado'}</p>
                        <p><strong>Horarios:</strong> ${salida.transporte.horarios || 'No especificado'}</p>
                        <p><strong>Precio servicio:</strong> ${salida.transporte.precio || 'No especificado'}</p>
                        <p><strong>Descripción:</strong> ${salida.transporte.descripcion || 'No especificado'}</p>
                    ` : '<p>Sin información de transporte.</p>'}

                    <h3>📋 Datos complementarios</h3>
                    <p><strong>Curso:</strong> ${salida.curso || 'Sin curso'}</p>
                    <p><strong>Precio por persona:</strong> ${salida.precio ? `$${salida.precio}` : 'No especificado'}</p>
                    <p><strong>Menú:</strong> ${salida.menu || 'Sin menú'}</p>
                </div>
            `;

            contenedor.innerHTML = html;

            const btnEditar = document.getElementById('btnAbrirEditar');
            if (btnEditar) {
                btnEditar.addEventListener('click', () => abrirModalEdicion(salida));
            }

            const btnEliminar = document.getElementById('btnEliminar');
            if (btnEliminar) {
                btnEliminar.addEventListener('click', () => eliminarSalida(salida.id));
            }
        }

        // ===== ABRIR MODAL DE EDICIÓN =====
        function abrirModalEdicion(salida) {
            document.getElementById('editId').value = salida.id;
            document.getElementById('editTitulo').value = salida.titulo || '';
            document.getElementById('editFecha').value = salida.fecha || '';
            document.getElementById('editDuracion').value = salida.duracion || '1 dia';
            document.getElementById('editDescripcion').value = salida.descripcion || '';

            const rutaContainer = document.getElementById('editRutaContainer');
            rutaContainer.innerHTML = '';
            if (salida.ruta && salida.ruta.length > 0) {
                salida.ruta.forEach((act, index) => {
                    const div = document.createElement('div');
                    div.className = 'ruta-edit-item';
                    div.innerHTML = `
                        <select class="edit-tipo-actividad">
                            <option value="Lugar" ${act.tipo === 'Lugar' ? 'selected' : ''}>📍 Lugar</option>
                            <option value="Traslado" ${act.tipo === 'Traslado' ? 'selected' : ''}>🚌 Traslado</option>
                            <option value="Pausa" ${act.tipo === 'Pausa' ? 'selected' : ''}>☕ Pausa</option>
                        </select>
                        <input type="text" class="edit-desc-actividad" value="${act.descripcion}" placeholder="Descripción">
                        <input type="time" class="edit-hora-inicio" value="${act.inicio || '09:00'}">
                        <input type="time" class="edit-hora-fin" value="${act.fin || '10:00'}">
                        <button type="button" class="btn-eliminar-actividad" data-index="${index}">✕</button>
                    `;
                    rutaContainer.appendChild(div);
                });
            } else {
                rutaContainer.innerHTML = '<p class="muted">No hay actividades.</p>';
            }

            const participantesContainer = document.getElementById('editParticipantesContainer');
            participantesContainer.innerHTML = '';
            if (salida.participantes && salida.participantes.length > 0) {
                salida.participantes.forEach((p, index) => {
                    const div = document.createElement('div');
                    div.className = 'participante-edit-item';
                    div.innerHTML = `
                        <span>${p.nombre} (${p.rut}) - ${p.rol}</span>
                        <button type="button" class="btn-eliminar-participante" data-index="${index}">✕</button>
                    `;
                    participantesContainer.appendChild(div);
                });
            } else {
                participantesContainer.innerHTML = '<p class="muted">No hay participantes.</p>';
            }

            document.getElementById('editConductor').value = salida.transporte?.conductor || '';
            document.getElementById('editHorarios').value = salida.transporte?.horarios || '';
            document.getElementById('editPrecioTransporte').value = salida.transporte?.precio || '';
            document.getElementById('editDescTransporte').value = salida.transporte?.descripcion || '';
            document.getElementById('editCurso').value = salida.curso || '';
            document.getElementById('editPrecio').value = salida.precio || '';
            document.getElementById('editMenu').value = salida.menu || '';

            editando = true;
            document.getElementById('modalEditar').style.display = 'flex';
        }

        function cerrarModalEdicion() {
            document.getElementById('modalEditar').style.display = 'none';
            editando = false;
        }
        window.cerrarModalEdicion = cerrarModalEdicion;

        // ===== GUARDAR EDICIÓN =====
        async function guardarEdicion(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const titulo = document.getElementById('editTitulo').value.trim();
            const fecha = document.getElementById('editFecha').value;
            const duracion = document.getElementById('editDuracion').value;
            const descripcion = document.getElementById('editDescripcion').value.trim();

            if (!titulo || !fecha) {
                alert('El título y la fecha son obligatorios.');
                return;
            }

            const rutaItems = document.querySelectorAll('#editRutaContainer .ruta-edit-item');
            const ruta = [];
            rutaItems.forEach(item => {
                const tipo = item.querySelector('.edit-tipo-actividad').value;
                const desc = item.querySelector('.edit-desc-actividad').value.trim();
                const inicio = item.querySelector('.edit-hora-inicio').value;
                const fin = item.querySelector('.edit-hora-fin').value;
                if (desc) ruta.push({ tipo, descripcion: desc, inicio, fin });
            });

            const participantes = [];
            document.querySelectorAll('#editParticipantesContainer .participante-edit-item').forEach(item => {
                const texto = item.textContent.replace('✕', '').trim();
                const match = texto.match(/^(.*?)\s*\(([^)]+)\)\s*-\s*(.*)$/);
                if (match) {
                    participantes.push({
                        nombre: match[1].trim(),
                        rut: match[2].trim(),
                        rol: match[3].trim()
                    });
                }
            });

            const transporte = {
                conductor: document.getElementById('editConductor').value.trim() || 'No especificado',
                horarios: document.getElementById('editHorarios').value.trim() || 'No especificado',
                precio: document.getElementById('editPrecioTransporte').value.trim() || 'No especificado',
                descripcion: document.getElementById('editDescTransporte').value.trim() || 'No especificado'
            };

            const curso = document.getElementById('editCurso').value.trim() || 'Sin curso';
            const precio = parseInt(document.getElementById('editPrecio').value) || 0;
            const menu = document.getElementById('editMenu').value.trim() || 'Sin menú';

            const salidaActualizada = {
                titulo,
                fecha,
                duracion,
                descripcion: descripcion || `Ruta con ${ruta.length} actividades.`,
                ruta,
                participantes,
                guias: participantes.filter(p => p.rol === 'Guía'),
                precio,
                curso,
                menu,
                transporte
            };

            const ok = await Planificacion.actualizarSalida(id, salidaActualizada);
            if (ok) {
                alert('✅ Salida actualizada correctamente.');
                cerrarModalEdicion();
                await cargarDatos();
                // Seleccionar la misma salida después de recargar
                window.seleccionarSalida(id);
            } else {
                alert('❌ Error al actualizar la salida.');
            }
        }

        // ===== EVENTOS DEL MODAL =====
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('modalCerrar').addEventListener('click', cerrarModalEdicion);
            document.getElementById('btnCancelarEdicion').addEventListener('click', cerrarModalEdicion);
            window.addEventListener('click', function(e) {
                if (e.target === document.getElementById('modalEditar')) cerrarModalEdicion();
            });

            document.getElementById('formEditarSalida').addEventListener('submit', guardarEdicion);

            document.getElementById('btnAgregarActividad').addEventListener('click', function() {
                const container = document.getElementById('editRutaContainer');
                const div = document.createElement('div');
                div.className = 'ruta-edit-item';
                div.innerHTML = `
                    <select class="edit-tipo-actividad">
                        <option value="Lugar">📍 Lugar</option>
                        <option value="Traslado">🚌 Traslado</option>
                        <option value="Pausa">☕ Pausa</option>
                    </select>
                    <input type="text" class="edit-desc-actividad" placeholder="Descripción">
                    <input type="time" class="edit-hora-inicio" value="09:00">
                    <input type="time" class="edit-hora-fin" value="10:00">
                    <button type="button" class="btn-eliminar-actividad">✕</button>
                `;
                container.appendChild(div);
                div.querySelector('.btn-eliminar-actividad').addEventListener('click', () => div.remove());
            });

            document.getElementById('editRutaContainer').addEventListener('click', function(e) {
                if (e.target.classList.contains('btn-eliminar-actividad')) {
                    e.target.closest('.ruta-edit-item').remove();
                }
            });

            document.getElementById('btnAgregarParticipante').addEventListener('click', async function() {
                const rutInput = document.getElementById('editNuevoParticipante');
                const rut = rutInput.value.trim();
                const rol = document.getElementById('editRolParticipante').value;
                if (!rut) return alert('Ingresa un RUT');

                const datos = await GitHub.leer('datos/usuarios.json');
                if (!datos) return alert('Error al cargar usuarios');
                const usuario = datos.usuarios.find(u => u.rut === rut);
                if (!usuario) return alert('Usuario no encontrado');

                const container = document.getElementById('editParticipantesContainer');
                for (let item of container.querySelectorAll('.participante-edit-item')) {
                    if (item.textContent.includes(`(${rut})`)) {
                        return alert('Este participante ya está en la lista.');
                    }
                }

                const div = document.createElement('div');
                div.className = 'participante-edit-item';
                div.innerHTML = `
                    <span>${usuario.nombre} ${usuario.apellido} (${rut}) - ${rol}</span>
                    <button type="button" class="btn-eliminar-participante">✕</button>
                `;
                container.appendChild(div);
                rutInput.value = '';
            });

            document.getElementById('editParticipantesContainer').addEventListener('click', function(e) {
                if (e.target.classList.contains('btn-eliminar-participante')) {
                    e.target.closest('.participante-edit-item').remove();
                }
            });
        });

        // ===== INICIALIZAR =====
        cargarDatos();

        console.log('✅ mis_salidas.html cargado correctamente con soporte para URL y eliminación');
    })();
</script>
</body>
</html>
